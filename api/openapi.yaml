openapi: 3.1.0
info:
  title: GaiaOS Canonical Carrier API
  version: 1.5.0
  description: >-
    Source-backed GaiaOS loader plus read-only Gaia Council, operator,
    deterministic dispatch, BrainOS support, source-pinned DictionaryOS and
    YggdrasilOS context navigation, HOT/WARM/COLD, and continuity surfaces.
    Routing, navigation, and presentation do not grant domain effect authority
    or settle Naomi's permanent operator identities.
servers:
  - url: https://REPLACE-WITH-YOUR-DEPLOYMENT-DOMAIN
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Optional in local development; required by the recommended Render deployment.
  schemas:
    DispatchRequest:
      type: object
      additionalProperties: false
      required: [signals]
      properties:
        signals:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
        requested_members:
          type: array
          maxItems: 12
          default: []
          items:
            type: string
        max_members:
          type: integer
          minimum: 1
          maximum: 32
          default: 3
paths:
  /gaiaos/load:
    get:
      operationId: loadGaiaOS
      summary: Load GaiaOS
      description: >-
        Resolve hurrisonferd/NaomiLeGaia on main, pin the load to one Git
        commit, and return the canonical bootstrap plus the current Gaia
        Council and cognitive support source bundle.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified GaiaOS bootstrap bundle.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid API key.
        '502':
          description: Canonical source unavailable or invalid.
  /gaiaos/council:
    get:
      operationId: getGaiaCouncil
      summary: Get the current Gaia Council
      description: >-
        Return the source-backed council contract, current FairyOS roster,
        operator profiles, prosody basins, dispatch matrix, EmojiOS surface,
        BrainOS/ConvoOS/ChatOS coordinates, and council command contract from
        one Git commit. The current six-slot roster remains placeholder until
        Naomi adopts or changes it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current Gaia Council packet.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid API key.
        '502':
          description: Canonical source unavailable or invalid.
  /gaiaos/operator/{member}:
    get:
      operationId: getGaiaOperator
      summary: Get one current GaiaOS operator
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: member
          required: true
          schema:
            type: string
          description: Current GaiaOS operator name, case-insensitive.
      responses:
        '200':
          description: Source-backed operator profile and dispatch surface.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Requested operator is not in the current GaiaOS roster.
        '401':
          description: Missing or invalid API key.
  /gaiaos/dispatch:
    post:
      operationId: dispatchGaiaCouncil
      summary: Route typed signals through the Gaia Council
      description: >-
        Deterministically route explicit typed signals through the current
        GaiaOS FairyOS dispatch matrix. Explicit current-member requests are
        preserved, unknowns stay visible, and the result is read-only routing,
        not domain execution.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchRequest'
      responses:
        '200':
          description: Deterministic Gaia Council dispatch packet.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid API key.
        '422':
          description: Invalid dispatch request.
        '502':
          description: Canonical source unavailable or invalid.
  /gaiaos/brain:
    get:
      operationId: getGaiaBrain
      summary: Get GaiaOS BrainOS support state
      description: >-
        Return the current read-only BrainOS support fabric, Context Compass
        contract, HOT/WARM/COLD controls, response and cast modes, ConvoOS
        re-entry coordinates, and MemberContinuityOS warm-candidate surface
        from one source-pinned GaiaOS commit. This endpoint does not create
        memory or execute domain effects.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current GaiaOS BrainOS and continuity support packet.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid API key.
        '502':
          description: Canonical source unavailable or invalid.
  /gaiaos/context:
    get:
      operationId: getGaiaContext
      summary: Resolve a natural subject through GaiaOS semantic navigation
      description: >-
        Resolve one natural-language subject against the current source-pinned
        DictionaryOS term registry, traverse explicit YggdrasilOS graph edges,
        and return a bounded context-path packet. This is read-only discovery;
        a term hit is not authority, a graph edge is not an effect, and the
        remote carrier does not claim full local-checkout lexical traversal.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: subject
          required: true
          schema:
            type: string
            minLength: 1
          description: Natural GaiaOS subject or phrase to resolve.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 10
          description: Maximum number of source paths returned.
        - in: query
          name: depth
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 3
            default: 1
          description: Maximum bounded YggdrasilOS traversal depth.
      responses:
        '200':
          description: Source-pinned DictionaryOS/YggdrasilOS context packet.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid API key.
        '422':
          description: Invalid or empty subject.
        '502':
          description: Canonical source unavailable or invalid.
  /health:
    get:
      operationId: health
      summary: Health check
      responses:
        '200':
          description: Service health and source-surface availability.
