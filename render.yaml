services:
  - type: web
    name: gaiaos-loader-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: GAIAOS_WORKSPACE_ROOT
        value: /data/gaiaos-workspace
      - key: GAIAOS_REPOSITORY
        value: hurrisonferd/NaomiLeGaia
      - key: GAIAOS_BRANCH
        value: main
      - key: GAIAOS_API_KEY
        generateValue: true
    disk:
      name: memconos-data
      mountPath: /data
      sizeGB: 1
