name: GALAXY Stage 9AF Signed Import to Served Chat LOCAL Gate

# All source data, database files, signing keys, browser sessions and model
# responses are disposable/synthetic CI only. No real Turso, actual OpenAI API,
# Render, production write, owner consent, memory promotion or BIGBANG release.
on:
  push:
    paths:
      - "api/galaxy_stage9af_signed_local_read_fixture.py"
      - "tests/test_galaxy_stage9af_signed_import_to_chat.py"
      - ".github/workflows/galaxy-stage9af-signed-import-to-chat.yml"
  pull_request:
    paths:
      - "api/galaxy_stage9af_signed_local_read_fixture.py"
      - "tests/test_galaxy_stage9af_signed_import_to_chat.py"
      - ".github/workflows/galaxy-stage9af-signed-import-to-chat.yml"

permissions:
  contents: read

jobs:
  signed-archive-to-actual-served-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual carrier and LOCAL test requirements
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0" "PyYAML>=6.0,<7.0"
      - name: Compile source-only real signed import to actual browser integration
        run: |
          python -m py_compile api/galaxy_stage9af_signed_local_read_fixture.py
          python -m py_compile tests/test_galaxy_stage9af_signed_import_to_chat.py
      - name: Prove the actual signed imported ROW cannot leak via actual reader, fallback or served /chat
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9af_signed_import_to_chat.py' -v
      - name: Check Stage 9AE independent operational, gateway and final model read barriers
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ae_staged_history_barrier.py' -v
      - name: Regress all Stage 9W served-app session, browser and edge tests
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9w_browser_chat_wiring.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9w_served_app.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9w_verified_linkage.py' -v
      - name: Regress signed 9Y/9Z and isolated 9AD historical gravity contract
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9y_canonical_staging.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9z_local_rollback.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ad_held_gravity_shadow.py' -v
      - name: Regress independent HEATDEATH and six E-LANE preservation
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_gaiaos_memory_gateway_stage3.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_heatdeath_legacy_recovery_stage4.py' -v
          for member in VERA ANVIL SELENE ORIN KESTREL NIMUE; do
            test -f "GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/$member-EXPERIENCES.v1.md"
          done
          grep -Fq '//PW:PRESERVE//' GaiaOS/Plans/PRESERVE-AND-SIX-E-LANES-PERMANENT-DESIGN-INVARIANT.v1.md
      - name: Assert synthetic adapter imports no remote access or deployment dependencies
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src = Path("api/galaxy_stage9af_signed_local_read_fixture.py").read_text()
          root = ast.parse(src)
          direct = [alias.name for x in root.body if isinstance(x,ast.Import) for alias in x.names]
          direct += [x.module for x in root.body if isinstance(x,ast.ImportFrom)]
          for blocked in ("libsql","requests","httpx","os","memcon_runtime","gaiaos_api","gaiaos_memory_mode"):
              assert blocked not in direct, blocked
          for blocked in ("TURSO_AUTH_TOKEN","GAIAOS_STAGE9V_STAGING_TOKEN","OPENAI_API_KEY","os.environ"):
              assert blocked not in src, blocked
          print("PASS: same-file native SQLite signed fixture contains no real remote/data/authority path")
          PY
