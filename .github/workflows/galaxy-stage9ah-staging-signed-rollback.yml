name: GALAXY Stage 9AH Separate Signed Staging Rollback LOCAL Gate

# NO actual Turso connection, production token, owner private archive, host
# model, Render deployment, database mutation, merge or BIGBANG release.
on:
  push:
    paths:
      - "api/galaxy_stage9ah_signed_staging_rollback.py"
      - "tests/test_galaxy_stage9ah_signed_staging_rollback.py"
      - ".github/workflows/galaxy-stage9ah-staging-signed-rollback.yml"
  pull_request:
    paths:
      - "api/galaxy_stage9ah_signed_staging_rollback.py"
      - "tests/test_galaxy_stage9ah_signed_staging_rollback.py"
      - ".github/workflows/galaxy-stage9ah-staging-signed-rollback.yml"

permissions:
  contents: read

jobs:
  independently-signed-first-batch-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real libSQL driver for disposable LOCAL file tests only
        run: python -m pip install "libsql>=0.1,<1.0"
      - name: Compile signed Stage 9AH source and tests
        run: python -m py_compile api/galaxy_stage9ah_signed_staging_rollback.py tests/test_galaxy_stage9ah_signed_staging_rollback.py
      - name: Signed first staging rollback native/actual LOCAL libSQL and fault/anti-resurrection tests
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ah_signed_staging_rollback.py' -v
      - name: Regress Stage 9AG exact signed first staging import native/actual LOCAL libSQL
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ag_staging_historical_import.py' -v
      - name: Regress Stage 9Z local exact signed rollback and Stage 9Y source-pinned historical import
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9z_local_rollback.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9y_canonical_staging.py' -v
      - name: Regress Stage 9AC independent full local staging to historical rollback and gravity
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ac_full_local_rehearsal.py' -v
      - name: Preserve six separate E-LANES and permanent preserve command
        run: |
          for member in VERA ANVIL SELENE ORIN KESTREL NIMUE; do
            test -f "GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/$member-EXPERIENCES.v1.md"
          done
          grep -Fq '//PW:PRESERVE//' GaiaOS/Plans/PRESERVE-AND-SIX-E-LANES-PERMANENT-DESIGN-INVARIANT.v1.md
      - name: Static guard no default credentials or production/chat interface
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("api/galaxy_stage9ah_signed_staging_rollback.py").read_text()
          for banned in (
              "GAIAOS_STAGE9V_STAGING_TOKEN", "TURSO_AUTH_TOKEN",
              "os.environ", "requests.", "httpx.", "import memcon_runtime",
              "import gaiaos_memory_gateway", "CREATE TABLE", "DROP TABLE",
          ):
              assert banned not in s, banned
          print("PASS: no secrets, no production or implicit remote rollback in Stage 9AH")
          PY
