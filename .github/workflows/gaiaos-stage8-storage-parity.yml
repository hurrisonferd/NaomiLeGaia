name: GaiaOS Stage 8 Storage Parity Gate

# Exactly one run per PR update; no schedule and no test canaries on Render.
on:
  pull_request:
    paths:
      - api/browser_memcon_bridge.py
      - tests/test_gaiaos_storage_parity_stage8.py
      - .github/workflows/gaiaos-stage8-storage-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original carrier dependencies
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile route and isolated tests
        run: python -m py_compile api/browser_memcon_bridge.py tests/test_gaiaos_storage_parity_stage8.py
      - name: Verify SELECT-only operational route and auth
        run: PYTHONPATH=api python -m unittest discover -s tests -p test_gaiaos_storage_parity_stage8.py -v
      - name: Repeat HEATDEATH optional-research isolation tests
        run: PYTHONPATH=api python -m unittest discover -s tests -p test_heatdeath_stage5d_research_policy.py -v
