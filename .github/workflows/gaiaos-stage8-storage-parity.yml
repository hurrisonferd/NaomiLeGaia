name: GaiaOS Stage 8 Storage Parity Gate

# Exactly one run per PR update; no schedule and no test canaries on Render.
on:
  pull_request:
    paths:
      - api/browser_memcon_bridge.py
      - api/memcon_entrypoint.py
      - GaiaOS/CURRENT.json
      - tests/test_gaiaos_storage_parity_stage8.py
      - tests/test_gaiaos_current_status_scope.py
      - tests/test_gaiaos_memory_outage_startup_minimal.py
      - .github/workflows/gaiaos-stage8-storage-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original carrier dependencies
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile route and isolated tests
        run: python -m py_compile api/browser_memcon_bridge.py api/memcon_entrypoint.py tests/test_gaiaos_storage_parity_stage8.py tests/test_gaiaos_current_status_scope.py tests/test_gaiaos_memory_outage_startup_minimal.py
      - name: Verify SELECT-only operational route and auth
        run: PYTHONPATH=api python -m unittest discover -s tests -p test_gaiaos_storage_parity_stage8.py -v
      - name: Verify exact minimal repair status and genuine fresh-process startup/member regression
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p test_gaiaos_current_status_scope.py -v
          PYTHONPATH=api python -m unittest discover -s tests -p test_gaiaos_memory_outage_startup_minimal.py -v
      - name: Actual production Docker image, offline synthetic Turso outage
        run: |
          docker build -f api/Dockerfile -t gaiaos-minimal-recovery:ci .
          docker run --rm -i --network none --entrypoint python \
            -e TURSO_DATABASE_URL=libsql://ci-never-connect.invalid \
            -e TURSO_AUTH_TOKEN=CI-FAKE-NOT-REAL \
            -e GAIAOS_API_KEY=CI-ONLY-API-KEY \
            -e OPENAI_API_KEY=CI-FAKE-NOT-REAL \
            -e MEMCONOS_DB_PATH=/tmp/ci-must-not-exist.sqlite \
            -e RENDER_GIT_COMMIT=CI-NOT-A-LIVE-DEPLOY \
            gaiaos-minimal-recovery:ci - <<'PY'
          from pathlib import Path
          from fastapi.testclient import TestClient
          import memcon_runtime as store
          assert store.STORAGE_BACKEND == "turso_libsql"
          assert store._INITIALIZED is False
          calls = []
          def offline():
              calls.append("SYNTHETIC_BACKEND_OUTAGE")
              raise OSError("CI_PRIVATE_SENTINEL_DO_NOT_DISCLOSE")
          store._db = offline
          import browser_memcon_bridge as bridge
          import gaiaos_api as base
          import gaiaos_app as source
          assert calls == []
          assert store._INITIALIZED is False
          client = TestClient(bridge.app, base_url="https://testserver")
          assert client.get("/health").status_code == 200
          assert calls == []
          assert client.get("/memconos/health").status_code == 401
          assert calls == []
          down = client.get("/memconos/health", headers={"Authorization": "Bearer CI-ONLY-API-KEY"})
          assert down.status_code == 503 and down.json()["detail"]["status"] == "HOLD_STORAGE_UNAVAILABLE"
          detail = down.json()["detail"]
          assert detail["backend"] == "turso_libsql"
          assert detail["storage_reachable"] is False
          effects = detail["side_effects"]
          assert effects["schema_initialization_called"] is True
          assert effects["schema_ddl_possible"] is True
          assert effects["backend_connection_side_effects_possible"] is True
          assert effects["fresh_select_attempted"] is False
          assert effects["memory_promotion_requested"] is False
          assert effects["audit_receipt_insert_requested"] is False
          assert effects["backend_write_effects_exhaustively_measured"] is False
          assert "writes_performed" not in detail
          assert "CI_PRIVATE_SENTINEL" not in down.text
          client.cookies.set(base.SESSION_COOKIE, base._session_token())
          before = len(calls)
          boot = client.post("/chat", json={"messages": [{"role":"user","content":"Load GaiaOS"}], "include_memory": False})
          assert boot.status_code == 200, boot.text
          assert "GAIAOS = ACTIVE / VERIFIED" in boot.json()["output"]
          assert len(calls) == before
          normal = client.post("/chat", json={"messages":[{"role":"user","content":"ANVIL, report in"}], "include_memory":False})
          assert normal.status_code == 503 and normal.json()["detail"]["status"] == "HOLD_SOLO_STATE_UNVERIFIED"
          assert client.get("/chat/recovery").status_code == 404
          assert not Path("/tmp/ci-must-not-exist.sqlite").exists()
          print("PASS: exact production Docker image boots source with remote down; memory health HOLD, normal member HOLD, no generic disguise or local fallback.")
          PY
      - name: Repeat HEATDEATH optional-research isolation tests
        run: PYTHONPATH=api python -m unittest discover -s tests -p test_heatdeath_stage5d_research_policy.py -v
