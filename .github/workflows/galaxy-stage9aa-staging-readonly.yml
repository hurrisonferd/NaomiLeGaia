name: GALAXY Stage 9AA Staging Read-Only Preimport Schema Gate

# Source/fixture CI only. No credentials, real Turso, workflow_dispatch or
# production access. Local libSQL exercises driver compatibility only.
on:
  push:
    paths:
      - "api/galaxy_stage9aa_preimport_readonly.py"
      - "api/galaxy_stage9aa_local_schema_bundle.py"
      - "tests/test_galaxy_stage9aa_preimport_readonly.py"
      - "tests/test_galaxy_stage9aa_local_schema_bundle.py"
      - ".github/workflows/galaxy-stage9aa-staging-readonly.yml"
  pull_request:
    paths:
      - "api/galaxy_stage9aa_preimport_readonly.py"
      - "tests/test_galaxy_stage9aa_preimport_readonly.py"
      - ".github/workflows/galaxy-stage9aa-staging-readonly.yml"

permissions:
  contents: read

jobs:
  isolated-readonly-preimport:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public driver for disposable LOCAL libSQL test only
        run: python -m pip install "libsql>=0.1,<1.0"
      - name: Stage 9AA strict SELECT-only staging schema and canary proof
        run: python -m unittest discover -s tests -p 'test_galaxy_stage9aa_preimport_readonly.py' -v
      - name: Verify private SQL bundle and exact six-table layout with zero effects
        run: python -m unittest discover -s tests -p 'test_galaxy_stage9aa_local_schema_bundle.py' -v
      - name: Stage 9Z signed local rollback and anti-resurrection regression
        run: python -m unittest discover -s tests -p 'test_galaxy_stage9z_local_rollback.py' -v
      - name: Stage 9Y canonical local import and source-provenance regression
        run: |
          python -m unittest discover -s tests -p 'test_galaxy_stage9y_canonical_staging.py' -v
          python -m unittest discover -s tests -p 'test_galaxy_archive_staging_stage9t.py' -v
      - name: No remote write, production runtime or source repo secret import
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("api/galaxy_stage9aa_preimport_readonly.py").read_text()
          for forbidden in (
              "import memcon_runtime", "import gaiaos_memory_gateway",
              "TURSO_AUTH_TOKEN", "turso_libsql",
              "stage_historical_fixture(", "rollback_local_import(",
          ):
              assert forbidden not in p, forbidden
          print("PASS: Stage 9AA has no data-mutating importer or production runtime")
          PY
