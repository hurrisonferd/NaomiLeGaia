name: GaiaOS Master Canary

# Single automatic verification surface. Individual legacy canary/smoke workflows
# are retained as manual diagnostics only. This workflow intentionally aggregates
# failures and reports exactly one failed job/run to the operator.

on:
  push:
    branches: [main]
    paths:
      - 'GaiaOS/**'
      - 'api/**'
      - 'plugins/gaiaos/**'
      - 'GAIAOS-LOAD.md'
      - '.github/workflows/gaiaos-master-canary.yml'
  pull_request:
    paths:
      - 'GaiaOS/**'
      - 'api/**'
      - 'plugins/gaiaos/**'
      - 'GAIAOS-LOAD.md'
      - '.github/workflows/gaiaos-master-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-canary:
    name: GaiaOS master canary (single failure surface)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MCP client
        run: python -m pip install 'mcp>=1.27.2,<2' httpx

      - name: Run all canary checks as one aggregated test
        shell: python
        env:
          GAIAOS_CANARY_BASE: https://gaiaos-loader-api.onrender.com
        run: |
          import asyncio
          import json
          import os
          import subprocess
          import sys
          import urllib.parse
          import urllib.request
          from pathlib import Path

          failures = []

          def check(name, fn):
              try:
                  fn()
                  print(f'PASS {name}')
              except Exception as exc:
                  failures.append((name, f'{type(exc).__name__}: {exc}'))
                  print(f'FAIL {name}: {type(exc).__name__}: {exc}')

          def run_script(name, path):
              def inner():
                  result = subprocess.run([sys.executable, path], text=True, capture_output=True)
                  print(result.stdout)
                  if result.returncode != 0:
                      print(result.stderr)
                      raise RuntimeError(f'{path} exited {result.returncode}')
              check(name, inner)

          # Local source canaries.
          run_script('FairyOS dispatch', 'GaiaOS/SystemsOS/Core/FairyOS/Tests/GAIAOS-FAIRYOS-DISPATCH-CANARY.py')
          run_script('ChatOS', 'GaiaOS/Apps/ChatOS/Tests/CHATOS-CANARY.py')
          run_script('Council dissent', 'GaiaOS/Apps/ChatOS/Tests/GAIAOS-COUNCIL-DISSENT-CANARY.py')
          run_script('Presentation gold', 'GaiaOS/Apps/ChatOS/Tests/GAIAOS-PRESENTATION-CANARY.py')
          run_script('DictionaryOS', 'GaiaOS/SystemsOS/Core/DictionaryOS/Tests/GAIAOS-DICTIONARY-CANARY.py')
          run_script('YggdrasilOS', 'GaiaOS/SystemsOS/Core/YggdrasilOS/Tests/GAIAOS-YGGDRASIL-CANARY.py')
          run_script('BrainOS Context Compass', 'GaiaOS/SystemsOS/Core/BrainOS/Tests/GAIAOS-CONTEXT-COMPASS-CANARY.py')
          run_script('Carrier context', 'api/gaiaos_context_canary.py')
          run_script('Self-definition context', 'api/gaiaos_self_definition_context_canary.py')
          run_script('Council prosody', 'GaiaOS/SystemsOS/Core/FairyOS/Runtime/GAIAOS-COUNCIL-PROSODY-CANARY.v1.py')

          def compile_sources():
              paths = [
                  'api/gaiaos_api.py', 'api/gaiaos_context_runtime.py', 'api/gaiaos_app.py',
                  'GaiaOS/SystemsOS/Core/DictionaryOS/Runtime/GAIAOS-DICTIONARY-RESOLVER.v1.py',
                  'GaiaOS/SystemsOS/Core/YggdrasilOS/Runtime/GAIAOS-YGGDRASIL-QUERY.v1.py',
                  'GaiaOS/SystemsOS/Core/BrainOS/Runtime/GAIAOS-CONTEXT-COMPASS.v1.py',
              ]
              for path in paths:
                  result = subprocess.run([sys.executable, '-m', 'py_compile', path], capture_output=True, text=True)
                  if result.returncode:
                      raise RuntimeError(f'{path}: {result.stderr.strip()}')
          check('Python source compilation', compile_sources)

          def source_surfaces():
              required = {
                  'GaiaOS/CURRENT.json': ['v0.001.007', '1.6.0', '"primary_tool": "gaia"'],
                  'GaiaOS/VERSION.json': ['v0.001.007', '1.6.0', 'gaia_selftest'],
                  'GaiaOS/LOAD.v1.md': ['Canonical Loader v4', 'gaia(request)'],
                  'GaiaOS/Apps/ChatOS/Protocols/GAIAOS-GPT-INSTRUCTIONS.v1.md': ['Primary connected-carrier behavior', 'gaia()'],
                  'GaiaOS/Apps/ChatOS/Protocols/GAIAOS-COUNCIL-COMMANDS.v1.md': ['COUNCIL EVERYONE'],
                  'GaiaOS/Apps/ChatOS/Protocols/GAIAOS-PRESENTATION-GOLD.v1.md': ['PRESENTATION ENERGY != EVIDENCE'],
                  'GaiaOS/SystemsOS/Core/DictionaryOS/CURRENT.json': ['GAIA-TERMS.v1.json', 'TERM HIT != AUTHORITY'],
                  'GaiaOS/SystemsOS/Core/YggdrasilOS/CURRENT.json': ['GAIA-GRAPH.v1.json', 'GRAPH EDGE != EFFECT'],
                  'GaiaOS/SystemsOS/Core/BrainOS/CURRENT.json': ['GAIAOS-CONTEXT-COMPASS.v1.py'],
                  'plugins/gaiaos/plugin.json': ['GaiaOS front door'],
              }
              missing = []
              for path, needles in required.items():
                  text = Path(path).read_text(encoding='utf-8')
                  missing.extend(f'{path}:{needle}' for needle in needles if needle not in text)
              json.loads(Path('GaiaOS/CURRENT.json').read_text(encoding='utf-8'))
              json.loads(Path('GaiaOS/VERSION.json').read_text(encoding='utf-8'))
              json.loads(Path('plugins/gaiaos/plugin.json').read_text(encoding='utf-8'))
              if missing:
                  raise RuntimeError(', '.join(missing))
          check('Source surface integrity', source_surfaces)

          BASE = os.environ['GAIAOS_CANARY_BASE']
          MCP = BASE + '/mcp'

          def get_json(path):
              req = urllib.request.Request(BASE + path, headers={'User-Agent': 'GaiaOS-Master-Canary/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status != 200:
                      raise RuntimeError(f'HTTP {r.status} {path}')
                  return json.loads(r.read().decode('utf-8'))

          def post_json(path, payload):
              data = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(BASE + path, data=data, headers={'content-type':'application/json','User-Agent':'GaiaOS-Master-Canary/1.0'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status != 200:
                      raise RuntimeError(f'HTTP {r.status} {path}')
                  return json.loads(r.read().decode('utf-8'))

          def live_http():
              health = get_json('/health')
              assert health.get('status') == 'ok', health
              assert health.get('api_version') == '1.6.0', health
              load = get_json('/gaiaos/load')
              council = get_json('/gaiaos/council')
              brain = get_json('/gaiaos/brain')
              context = get_json('/gaiaos/context?subject=' + urllib.parse.quote('council operator') + '&limit=7&depth=2')
              dispatch = post_json('/gaiaos/dispatch', {'signals':['FRAME','PROOF_EDGE','NEXT_STEP'],'requested_members':[],'max_members':3})
              sources = [load['gaiaos']['source'], council['source'], brain['source'], context['source'], dispatch['source']]
              assert len(set(sources)) == 1, sources
              assert dispatch['authority'] == 'NAOMI'
              assert dispatch['effect_authority'] == 'NONE_READ_ONLY_DISPATCH'
              assert [x['member'] for x in dispatch['selected']] == ['KESTREL','VERA','ANVIL']
              assert context['source_binding'] == 'DEPLOYED_CHECKOUT'
              assert context['context_pack']
              for member in ['VERA','ANVIL','SELENE','ORIN','KESTREL','NIMUE']:
                  p = get_json('/gaiaos/operator/' + member.lower())
                  assert p['member'] == member
                  assert p['source'] == sources[0]
              unknown = post_json('/gaiaos/dispatch', {'signals':['TOTALLY_UNKNOWN'],'requested_members':['NOPE'],'max_members':1})
              assert unknown['unknown_signals'] == ['TOTALLY_UNKNOWN']
              assert unknown['unknown_requested_members'] == ['NOPE']
              assert unknown['selected'] == []
              explicit = post_json('/gaiaos/dispatch', {'signals':['FRAME'],'requested_members':['NIMUE'],'max_members':1})
              assert [x['member'] for x in explicit['selected']] == ['NIMUE']
              assist = post_json('/gaiaos/assist', {'request':'Raven should not be the mailman. Simplify the next step.'})
              assert assist['carrier_version'] == '1.6.0'
              assert assist['platform_version'] == 'v0.001.007'
              assert assist['route']['manual_tool_chain_required'] is False
              selftest = get_json('/gaiaos/selftest')
              assert selftest['status'] == 'PASS'
              assert selftest['source'] == sources[0]
          check('Live HTTP acceptance', live_http)

          def self_definition_live():
              def gaia(request):
                  return post_json('/gaiaos/assist', {'request': request})
              artifact = 'GaiaOS/SystemsOS/Core/MemberContinuityOS/COUNCIL-SELF-DEFINITION-CONTINUITY.v1.md'
              relevant = gaia('How should the Council members preserve identity, native prosody, handoff geometry, disagreement law, and cold-start reconstruction?')
              paths = [str(x.get('path','')) for x in (relevant.get('context') or {}).get('context_pack',[])]
              assert artifact in paths, paths
              assert 'REMOTE CONTEXT PACK != DURABLE MEMORY' in set((relevant.get('context') or {}).get('laws',[]))
              unrelated = gaia('What color should I paint my notebook?')
              paths = [str(x.get('path','')) for x in (unrelated.get('context') or {}).get('context_pack',[])]
              assert artifact not in paths, paths
          check('Live self-definition routing', self_definition_live)

          async def mcp_live():
              from mcp import ClientSession
              from mcp.client.streamable_http import streamable_http_client
              async with streamable_http_client(MCP) as transport:
                  read_stream, write_stream = transport[0], transport[1]
                  async with ClientSession(read_stream, write_stream) as session:
                      initialized = await session.initialize()
                      server = initialized.serverInfo.name if hasattr(initialized, 'serverInfo') else initialized.server_info.name
                      assert server == 'GaiaOS Carrier', server
                      instructions = getattr(initialized, 'instructions', None) or ''
                      assert 'PRIMARY FRONT DOOR' in instructions
                      assert 'gaia(request)' in instructions
                      tools = await session.list_tools()
                      names = {t.name for t in tools.tools}
                      assert {'gaia','gaia_selftest','load_gaiaos','gaia_council','gaia_dispatch','gaia_operator','gaia_brain','gaia_context'} <= names, names
                      def payload(result):
                          value = getattr(result, 'structuredContent', None) or getattr(result, 'structured_content', None)
                          if isinstance(value, dict): return value
                          for block in getattr(result, 'content', []) or []:
                              text = getattr(block, 'text', None)
                              if isinstance(text, str):
                                  try: value = json.loads(text)
                                  except json.JSONDecodeError: continue
                                  if isinstance(value, dict): return value
                          raise RuntimeError('MCP result had no parseable object payload')
                      front = payload(await session.call_tool('gaia', arguments={'request':'Raven should not be the mailman. Simplify the next step.'}))
                      assert front['route']['manual_tool_chain_required'] is False
                      assert front['source'].startswith('hurrisonferd/NaomiLeGaia@')
                      st = payload(await session.call_tool('gaia_selftest', arguments={}))
                      assert st['status'] == 'PASS'
                      dispatch = payload(await session.call_tool('gaia_dispatch', arguments={'signals':['FRAME','PROOF_EDGE','NEXT_STEP'],'requested_members':[],'max_members':3}))
                      assert [x['member'] for x in dispatch['selected']] == ['KESTREL','VERA','ANVIL']
                      explicit = payload(await session.call_tool('gaia', arguments={'request':'Ask Vera to frame this and Anvil to verify the proof.','max_members':1}))
                      assert explicit['route']['requested_members'] == ['VERA','ANVIL']
                      unknown = payload(await session.call_tool('gaia', arguments={'request':'zorb flarn quux','include_context':False}))
                      assert unknown['route']['signals'] == []
                      assert unknown['route']['selected_members'] == []
          asyncio.run(check_async := asyncio.sleep(0))
          try:
              asyncio.run(mcp_live())
              print('PASS Live MCP acceptance')
          except Exception as exc:
              failures.append(('Live MCP acceptance', f'{type(exc).__name__}: {exc}'))
              print(f'FAIL Live MCP acceptance: {type(exc).__name__}: {exc}')

          print('\n=== GAIAOS MASTER CANARY SUMMARY ===')
          if failures:
              for name, reason in failures:
                  print(f'FAILED: {name} | {reason}')
              print(f'GAIAOS_MASTER_CANARY_FAIL count={len(failures)}')
              raise SystemExit(1)
          print('GAIAOS_MASTER_CANARY_PASS')
