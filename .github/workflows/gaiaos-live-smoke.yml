name: GaiaOS Live Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gaiaos-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    name: Probe live GaiaOS Render carrier
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe /health and /gaiaos/context
        shell: python
        run: |
          import json
          import time
          import urllib.parse
          import urllib.request

          base = 'https://gaiaos-loader-api.onrender.com'

          def get_json(url, attempts=36, delay=5):
              last = None
              for i in range(attempts):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'GaiaOS-Live-Smoke/1.0'})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          if r.status != 200:
                              raise RuntimeError(f'HTTP {r.status}')
                          return json.loads(r.read().decode('utf-8'))
                  except Exception as exc:
                      last = exc
                      print(f'attempt {i+1}/{attempts} failed: {exc}')
                      time.sleep(delay)
              raise SystemExit(f'LIVE_SMOKE_FAIL {url}: {last}')

          health = get_json(base + '/health')
          print('HEALTH', json.dumps(health, sort_keys=True))
          if health.get('status') != 'ok':
              raise SystemExit('LIVE_SMOKE_FAIL health status')
          if health.get('api_version') != '1.5.0':
              raise SystemExit(f"LIVE_SMOKE_FAIL api_version={health.get('api_version')}")

          subject = urllib.parse.quote('council operator')
          context = get_json(base + '/gaiaos/context?subject=' + subject)
          print('CONTEXT', json.dumps(context, sort_keys=True))

          if context.get('authority') != 'NAOMI':
              raise SystemExit('LIVE_SMOKE_FAIL context authority')
          if context.get('effect_authority') != 'NONE_READ_ONLY':
              raise SystemExit('LIVE_SMOKE_FAIL context effect_authority')
          if context.get('mode') != 'SOURCE_PINNED_DICTIONARY_GRAPH_READ_ONLY':
              raise SystemExit(f"LIVE_SMOKE_FAIL context mode={context.get('mode')}")
          if not context.get('term_candidates'):
              raise SystemExit('LIVE_SMOKE_FAIL no term candidates')
          if not context.get('graph_context'):
              raise SystemExit('LIVE_SMOKE_FAIL no graph context')

          print('GAIAOS_LIVE_SMOKE_PASS')
