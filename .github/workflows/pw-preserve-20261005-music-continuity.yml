name: PW Preserve 2026-10-05 Music Continuity

on:
  push:
    branches:
      - preserve/pw-preserve-20261005-music-continuity
    paths:
      - .github/workflows/pw-preserve-20261005-music-continuity.yml

permissions:
  contents: write

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preservation transport branch
        uses: actions/checkout@v4
        with:
          ref: preserve/pw-preserve-20261005-music-continuity
          fetch-depth: 0

      - name: Copy bounded payload and pin canonical main
        shell: bash
        run: |
          set -euo pipefail
          expected='353a7d3f5e40aae0ec937995fba77724703fa06d'
          cp GaiaOS/Tools/preserve_20261005_music_continuity.py /tmp/preserve_20261005_music_continuity.py
          git fetch origin main
          actual="$(git rev-parse origin/main)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$actual" = "$expected"
          git checkout --detach "$expected"

      - name: Apply bounded append-only preservation
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/preserve_20261005_music_continuity.py

      - name: Verify exact mutation surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            'GaiaOS/MemoryOS/PW-PRESERVE-2026-10-05-MUSIC-CREATIVE-WORKFLOW-AND-INTERACTION-LESSONS.md' \
            'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/ANVIL-EXPERIENCES.v1.md' \
            'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/KESTREL-EXPERIENCES.v1.md' \
            'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/NIMUE-EXPERIENCES.v1.md' \
            'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/ORIN-EXPERIENCES.v1.md' \
            'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/SELENE-EXPERIENCES.v1.md' \
            'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/VERA-EXPERIENCES.v1.md' | sort)"
          printf 'CHANGED FILES:\n%s\n' "$actual"
          test "$actual" = "$expected"

      - name: Commit and push canonical preservation
        shell: bash
        run: |
          set -euo pipefail
          expected='353a7d3f5e40aae0ec937995fba77724703fa06d'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected"
          git config user.name 'GaiaOS Preservation Executor'
          git config user.email 'gaiaos-preserve@users.noreply.github.com'
          git add \
            GaiaOS/MemoryOS/PW-PRESERVE-2026-10-05-MUSIC-CREATIVE-WORKFLOW-AND-INTERACTION-LESSONS.md \
            GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/ANVIL-EXPERIENCES.v1.md \
            GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/KESTREL-EXPERIENCES.v1.md \
            GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/NIMUE-EXPERIENCES.v1.md \
            GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/ORIN-EXPERIENCES.v1.md \
            GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/SELENE-EXPERIENCES.v1.md \
            GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/VERA-EXPERIENCES.v1.md
          git commit -m 'Preserve Oct 5 music and interaction lessons [skip render]'
          new_sha="$(git rev-parse HEAD)"
          echo "NEW_COMMIT=$new_sha"
          git push origin HEAD:main
          echo "PUSHED_COMMIT=$new_sha"
