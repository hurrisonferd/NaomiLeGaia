name: GaiaOS OCA Canary

on:
  workflow_dispatch:
  push:
    paths:
      - 'GaiaOS/Apps/ChatOS/Protocols/GAIAOS-OPERATIONAL-CONTEXT-ACQUISITION.v1.md'
      - 'GaiaOS/Apps/ChatOS/Protocols/GAIAOS-OCA-HOTCARD.v1.json'
      - 'GaiaOS/Apps/ChatOS/Protocols/GAIAOS-OCA-ADAPTERS.v1.json'
      - 'GaiaOS/Apps/ChatOS/Schemas/GAIAOS-OCA-PACKET.v1.schema.json'
      - 'GaiaOS/Apps/ChatOS/Runtime/GAIAOS-OCA.v1.py'
      - 'GaiaOS/Apps/ChatOS/Tests/GAIAOS-OCA-CANARY.py'
      - 'GaiaOS/Apps/ChatOS/CURRENT.json'
      - '.github/workflows/gaiaos-oca-canary.yml'

permissions:
  contents: read

jobs:
  oca-canary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only OCA canary
        run: python GaiaOS/Apps/ChatOS/Tests/GAIAOS-OCA-CANARY.py
