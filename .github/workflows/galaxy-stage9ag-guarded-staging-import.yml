name: GALAXY Stage 9AG First Staging Historical Import LOCAL Gate

# NO secrets, actual Turso connection, source archive, production/main access,
# remote writes, owner authentication or automatic BIGBANG activation in CI.
on:
  push:
    paths:
      - "api/galaxy_stage9ag_staging_historical_import.py"
      - "tests/test_galaxy_stage9ag_staging_historical_import.py"
      - ".github/workflows/galaxy-stage9ag-guarded-staging-import.yml"
  pull_request:
    paths:
      - "api/galaxy_stage9ag_staging_historical_import.py"
      - "tests/test_galaxy_stage9ag_staging_historical_import.py"
      - ".github/workflows/galaxy-stage9ag-guarded-staging-import.yml"

permissions:
  contents: read

jobs:
  first-staging-held-batch-local:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual libSQL driver for disposable LOCAL file only
        run: python -m pip install "libsql>=0.1,<1.0"
      - name: Compile first remote-ready signed staging adapter and local fixture tests
        run: python -m py_compile api/galaxy_stage9ag_staging_historical_import.py tests/test_galaxy_stage9ag_staging_historical_import.py
      - name: Verify first signed batch native SQLite and real LOCAL libSQL, negative fault cases
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ag_staging_historical_import.py' -v
      - name: Preserve Stage 9AA pinned read-only schema, Stage 9AB private bootstrap
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9aa_preimport_readonly.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ab_owner_local_bootstrap.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ab_prepare_private_bundle.py' -v
      - name: Preserve Stage 9AC complete native/libSQL local import and rollback integration
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9ac_full_local_rehearsal.py' -v
      - name: Preserve Stage 9Y exact local fixture, 9Z signed rollback and 9AF browser no-leak
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9y_canonical_staging.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_stage9z_local_rollback.py' -v
      - name: Explicit no-secret no-production static boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("api/galaxy_stage9ag_staging_historical_import.py").read_text()
          for forbidden in (
            "GAIAOS_STAGE9V_STAGING_TOKEN", "TURSO_AUTH_TOKEN",
            "os.environ", "requests.", "httpx.", "import memcon_runtime",
            "import gaiaos_memory_gateway",
            "UPDATE memory_records", "DELETE FROM memory_records",
            "CREATE TABLE", "DROP TABLE",
          ):
            assert forbidden not in src, forbidden
          print("PASS: source-only guard contains no secret loading, live credentials or production interface")
          PY
