name: GALAXY Phase 7A-7E Pruning Research Source Gate

on:
  push:
    paths:
      - "api/galaxy_phase7.py"
      - "api/galaxy_phase7_tombstone.py"
      - "api/galaxy_phase7_tombstone_shadow.py"
      - "api/memcon_runtime.py"
      - "api/browser_memcon_bridge.py"
      - "api/Dockerfile"
      - "tests/test_galaxy_phase7.py"
      - "GaiaOS/SystemsOS/Core/BrainOS/Protocols/GALAXY-PHASE7-PRUNING-RESEARCH.v1.md"
      - ".github/workflows/galaxy-phase7-pruning-research.yml"
  pull_request:
    paths:
      - "api/galaxy_phase7.py"
      - "api/galaxy_phase7_tombstone.py"
      - "api/galaxy_phase7_tombstone_shadow.py"
      - "api/memcon_runtime.py"
      - "api/browser_memcon_bridge.py"
      - "api/Dockerfile"
      - "tests/test_galaxy_phase7.py"
      - "GaiaOS/SystemsOS/Core/BrainOS/Protocols/GALAXY-PHASE7-PRUNING-RESEARCH.v1.md"
      - ".github/workflows/galaxy-phase7-pruning-research.yml"
  workflow_dispatch:

jobs:
  nondestructive-source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Phase 7A-7E
        run: |
          python -m py_compile api/galaxy_phase7.py
          python -m py_compile api/galaxy_phase7_tombstone.py
          python -m py_compile api/galaxy_phase7_tombstone_shadow.py
          python -m py_compile api/memcon_runtime.py
          python -m py_compile api/browser_memcon_bridge.py
          python -m py_compile tests/test_galaxy_phase7.py
      - name: Prove pruning research, tombstone contract, and isolated shadow persistence gates
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p "test_galaxy_phase7.py" -v
      - name: Guard against source formatting errors
        run: git diff --check HEAD^1 HEAD
