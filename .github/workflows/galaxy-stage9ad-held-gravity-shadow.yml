name: GALAXY Stage 9AD Held Historical Gravity Shadow LOCAL Gate

# Tests ONLY. No real Turso connections, owner credentials, deployment,
# production data, gravity activation or E-LANE modifications.
on:
  push:
    paths:
      - "api/galaxy_stage9ad_held_gravity_shadow.py"
      - "api/galaxy_stage9ac_full_local_rehearsal.py"
      - "tests/test_galaxy_stage9ad_held_gravity_shadow.py"
      - ".github/workflows/galaxy-stage9ad-held-gravity-shadow.yml"
  pull_request:
    paths:
      - "api/galaxy_stage9ad_held_gravity_shadow.py"
      - "api/galaxy_stage9ac_full_local_rehearsal.py"
      - "tests/test_galaxy_stage9ad_held_gravity_shadow.py"
      - ".github/workflows/galaxy-stage9ad-held-gravity-shadow.yml"

permissions:
  contents: read

jobs:
  signed-historical-shadow-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real libSQL driver for local file rehearsal ONLY
        run: python -m pip install "libsql>=0.1,<1.0"
      - name: Stage 9AD signed imported history must remain HOLD while isolated U backfills synthetic ACTIVE
        run: python -m unittest discover -s tests -p 'test_galaxy_stage9ad_held_gravity_shadow.py' -v
      - name: Integrated 9AB-through-9AD-through-9Z full synthetic local rehearsal
        run: python -m unittest discover -s tests -p 'test_galaxy_stage9ac_full_local_rehearsal.py' -v
      - name: Full synthetic chain native and libSQL local files
        run: |
          python api/galaxy_stage9ac_full_local_rehearsal.py --local-fixture-only --driver native
          python api/galaxy_stage9ac_full_local_rehearsal.py --local-fixture-only --driver libsql
      - name: Stage 9U original independently tested shadow gravity regression
        run: python -m unittest discover -s tests -p 'test_galaxy_shadow_backfill_stage9u.py' -v
      - name: Canonical Y importer, independently signed Z rollback and six-lane S preflight
        run: |
          python -m unittest discover -s tests -p 'test_galaxy_stage9y_canonical_staging.py' -v
          python -m unittest discover -s tests -p 'test_galaxy_stage9z_local_rollback.py' -v
          python -m unittest discover -s tests -p 'test_galaxy_archive_preflight_stage9s.py' -v
      - name: Explicit source ban on remote adapter and production runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("api/galaxy_stage9ad_held_gravity_shadow.py").read_text()
          for forbidden in (
              "import libsql", "TURSO_AUTH_TOKEN", "GAIAOS_STAGE9V_STAGING_TOKEN",
              "import memcon_runtime", "import gaiaos_memory_gateway",
              "requests.", "httpx.", "os.environ",
          ):
              assert forbidden not in source, forbidden
          print("PASS: Stage 9AD operates solely on native LOCAL sqlite and in-memory U")
          PY
