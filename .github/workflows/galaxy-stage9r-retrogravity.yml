name: GALAXY Stage 9R Legacy Gravity Interoperability

on:
  pull_request:
    paths:
      - "api/galaxy_legacy_gravity.py"
      - "api/galaxy_frontdoor_context.py"
      - "tests/test_galaxy_legacy_gravity_stage9r.py"
      - "tests/test_bigbang_operational_reader_stage6.py"
      - "GaiaOS/SystemsOS/Core/MemoryOS/LEGACY-GALAXY-RETROGRAVITY-INTEROP.v1.md"
      - ".github/workflows/galaxy-stage9r-retrogravity.yml"
  push:
    paths:
      - "api/galaxy_legacy_gravity.py"
      - "api/galaxy_frontdoor_context.py"
      - "tests/test_galaxy_legacy_gravity_stage9r.py"
      - "tests/test_bigbang_operational_reader_stage6.py"
      - ".github/workflows/galaxy-stage9r-retrogravity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrogravity-legacy-failover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime and test dependencies
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile isolated historical gravity and optional reader
        run: python -m py_compile api/galaxy_legacy_gravity.py api/galaxy_frontdoor_context.py tests/test_galaxy_legacy_gravity_stage9r.py
      - name: Prove historical inventory and absent-score policy
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_galaxy_legacy_gravity_stage9r.py" -v
      - name: Prove BIGBANG optional reader and original HEATDEATH fallback
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_operational_reader_stage6.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_memory_gateway_stage3.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_legacy_memory_baseline.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_heatdeath_legacy_recovery_stage4.py" -v
      - name: Source whitespace integrity
        run: git diff --check HEAD^1 HEAD
