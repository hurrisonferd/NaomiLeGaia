name: GaiaOS BIGBANG Stage 7 Readiness Gate

on:
  # One review run per PR revision. Avoid duplicate push+PR emails.
  pull_request:
    paths:
      - "api/gaiaos_bigbang_readiness.py"
      - "api/gaiaos_historical_evidence_audit.py"
      - "api/gaiaos_historical_audit_console.py"
      - "api/gaiaos_one_click_readiness.py"
      - "api/gaiaos_one_click_console.py"
      - "tests/test_gaiaos_one_click_stage9l.py"
      - "GaiaOS/Plans/GALAXY-STAGE9L-ONE-CLICK-SAFE-CHECKS.v1.md"
      - "tests/test_gaiaos_historical_audit_console_stage9k.py"
      - "GaiaOS/Plans/GALAXY-STAGE9K-ONE-BUTTON-HISTORY-CONSOLE.v1.md"
      - "tests/test_gaiaos_historical_evidence_stage9j.py"
      - "GaiaOS/Plans/GALAXY-STAGE9J-HISTORICAL-EVIDENCE-AUDIT.v1.md"
      - "api/augury_semantic_retrieval.py"
      - "api/augury_semantic_sample.py"
      - "api/augury_semantic_receipts.py"
      - "api/augury_semantic_collision.py"
      - "tests/test_augury_semantic_collision_stage9i.py"
      - "GaiaOS/Plans/AUGURY-SEMANTIC-STAGE9I-TWO-SOURCE-COLLISION.v1.md"
      - "tests/test_augury_semantic_receipts_stage9h.py"
      - "GaiaOS/Plans/AUGURY-SEMANTIC-STAGE9H-ATTESTED-RECEIPTS.v1.md"
      - "tests/test_augury_semantic_sample_stage9g.py"
      - "GaiaOS/Plans/AUGURY-SEMANTIC-STAGE9G-BOUND-SAMPLE-COLLISION.v1.md"
      - "tests/test_augury_semantic_retrieval_stage9f.py"
      - "tests/test_gaiaos_console_browser_contract.py"
      - "GaiaOS/Plans/GAIAOS-RENDER-CONSOLE-BROWSER-INTEGRITY.v1.md"
      - "api/gaiaos_app.py"
      - "api/Dockerfile"
      - "tests/test_bigbang_real_memory_readiness_stage7.py"
      - "GaiaOS/Plans/BIGBANG-STAGE7-REAL-MEMORY-READINESS.v1.md"
      - ".github/workflows/gaiaos-bigbang-stage7-readiness.yml"
  workflow_dispatch:

jobs:
  real-store-review-contract-and-safety-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install normal carrier and test dependencies
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile reviewer, routes and fixtures
        run: |
          python -m py_compile api/gaiaos_bigbang_readiness.py api/gaiaos_app.py
          python -m py_compile api/gaiaos_historical_evidence_audit.py tests/test_gaiaos_historical_evidence_stage9j.py
          python -m py_compile api/gaiaos_historical_audit_console.py tests/test_gaiaos_historical_audit_console_stage9k.py
          python -m py_compile api/gaiaos_one_click_readiness.py api/gaiaos_one_click_console.py tests/test_gaiaos_one_click_stage9l.py
          python -m py_compile api/augury_semantic_retrieval.py tests/test_augury_semantic_retrieval_stage9f.py
          python -m py_compile api/augury_semantic_receipts.py tests/test_augury_semantic_receipts_stage9h.py
          python -m py_compile api/augury_semantic_collision.py tests/test_augury_semantic_collision_stage9i.py
          python -m py_compile tests/test_bigbang_real_memory_readiness_stage7.py
      - name: Verify data-driven gate and HTTP/MCP review plumbing
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_real_memory_readiness_stage7.py" -v
      - name: Diagnose historical readiness gaps on isolated owner-technical fixtures
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_historical_evidence_stage9j.py" -v
      - name: Verify Stage9K real rendered owner history page and redacted click-path safety
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_historical_audit_console_stage9k.py" -v
      - name: Verify one-click six-check source safety and actual button path
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_one_click_stage9l.py" -v
      - name: Verify optional AUGURY semantic shadow and strict source-backed safeguards
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_augury_semantic_retrieval_stage9f.py" -v
      - name: Verify keyed sample identity and collision-aware redacted comparison
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_augury_semantic_sample_stage9g.py" -v
      - name: Verify authenticated Stage9H receipts and model-free comparison
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_augury_semantic_receipts_stage9h.py" -v
      - name: Verify owner-adjudicated two-source collision quote and readback proof
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_augury_semantic_collision_stage9i.py" -v
      - name: Verify actual served console JavaScript and every button handler
        run: |
          node --version
          PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_console_browser_contract.py" -v
      - name: Repeat Stage 6 operational evidence contract
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_operational_reader_stage6.py" -v
      - name: Repeat original HEATDEATH and normal carrier regression suite
        run: |
          for test in test_bigbang_heatdeath_browser_stage5b.py test_bigbang_heatdeath_routes_stage5a.py test_heatdeath_stage5d_research_policy.py test_heatdeath_stage5c_normal_boot.py test_heatdeath_legacy_recovery_stage4.py test_gaiaos_memory_gateway_stage3.py test_gaiaos_memory_mode_stage2.py test_legacy_memory_baseline.py; do
            PYTHONPATH=api python -m unittest discover -s tests -p "$test" -v || exit 1
          done
      - name: Build normal image and independent HEATDEATH image
        run: |
          docker build --file api/Dockerfile --tag gaiaos-normal:stage7 .
          docker build --file api/Dockerfile.legacy-recovery --build-arg RECOVERY_SOURCE_COMMIT="$GITHUB_SHA" --tag gaiaos-heatdeath:stage7 .
          docker run --rm --entrypoint python -e MEMCONOS_DB_PATH=/tmp/gaiaos-stage7.sqlite gaiaos-normal:stage7 -c "import gaiaos_bigbang_readiness as r; assert callable(r.review); print('STAGE7_NORMAL_IMAGE_PASS')"
          docker run --rm --entrypoint python -e MEMCONOS_DB_PATH=/tmp/gaiaos-stage9j.sqlite gaiaos-normal:stage7 -c "import gaiaos_historical_evidence_audit as h, gaiaos_app as a; assert callable(h.audit); assert any(getattr(r, 'path', None) == '/gaiaos/memory/historical-evidence-audit' for r in a.app.routes); print('STAGE9J_HISTORY_DIAGNOSTIC_IMAGE_PASS')"
          docker run --rm --entrypoint python -e MEMCONOS_DB_PATH=/tmp/gaiaos-stage9k.sqlite gaiaos-normal:stage7 -c "import gaiaos_historical_audit_console as c, gaiaos_app as a; assert '<script nonce=\"ci-nonce\"' in c.render('ci-nonce'); assert any(getattr(r, 'path', None) == '/gaiaos/memory/historical-audit-console' for r in a.app.routes); print('STAGE9K_OWNER_HISTORY_PAGE_IMAGE_PASS')"
          docker run --rm --entrypoint python -e MEMCONOS_DB_PATH=/tmp/gaiaos-stage9l.sqlite gaiaos-normal:stage7 -c "import gaiaos_one_click_readiness as r, gaiaos_one_click_console as c, gaiaos_app as a; assert callable(r.run) and '<script nonce=\"ci-nonce\"' in c.render('ci-nonce'); assert any(getattr(x, 'path', None) == '/gaiaos/memory/one-click-console' for x in a.app.routes); assert any(getattr(x, 'path', None) == '/gaiaos/memory/one-click-readiness' for x in a.app.routes); print('STAGE9L_ONE_CLICK_NORMAL_IMAGE_PASS')"
          docker run --rm --entrypoint python -e MEMCONOS_DB_PATH=/tmp/gaiaos-stage9f.sqlite gaiaos-normal:stage7 -c "import augury_semantic_retrieval as s, gaiaos_app as a; assert s.RITUAL_ID == 'GALAXY.MEMORYOS.READ_ONLY.SHADOW.v1'; assert any(getattr(r, 'path', None) == '/gaiaos/memory/augury-semantic-shadow' for r in a.app.routes); print('STAGE9F_CONTAINER_ROUTE_PASS')"
          docker run --rm --entrypoint python -e MEMCONOS_DB_PATH=/tmp/gaiaos-stage9h.sqlite gaiaos-normal:stage7 -c "import augury_semantic_receipts as r, gaiaos_app as a; assert callable(r.compare_attested); assert any(getattr(x, 'path', None) == '/gaiaos/memory/augury-semantic-compare' for x in a.app.routes); print('STAGE9H_CONTAINER_ROUTE_PASS')"
          docker run --rm --entrypoint python -e MEMCONOS_DB_PATH=/tmp/gaiaos-stage9i.sqlite gaiaos-normal:stage7 -c "import augury_semantic_collision as r, gaiaos_app as a; assert callable(r.review); assert any(getattr(x, 'path', None) == '/gaiaos/memory/augury-collision-two-source-shadow' for x in a.app.routes); print('STAGE9I_CONTAINER_ROUTE_PASS')"
          docker run --rm --entrypoint python gaiaos-heatdeath:stage7 -c "import sys, gaiaos_legacy_recovery_app as a; assert a.SERVICE == 'gaiaos-legacy-recovery'; assert not any(n.startswith('galaxy_') for n in sys.modules); print('STAGE7_HEATDEATH_IMAGE_PASS')"
      - name: Source whitespace
        run: git diff --check HEAD^1 HEAD
