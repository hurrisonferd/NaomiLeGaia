name: GaiaOS BIGBANG HEATDEATH Stage 5A Route Wiring

on:
  push:
    paths:
      - "api/gaiaos_app.py"
      - "api/Dockerfile"
      - "GaiaOS/SystemsOS/Core/MemoryOS/Runtime/GAIAOS-MEMORY.v1.py"
      - "tests/test_bigbang_heatdeath_routes_stage5a.py"
      - "GaiaOS/Plans/BIGBANG-HEATDEATH-STAGE5A-ROUTE-WIRING.v1.md"
      - ".github/workflows/gaiaos-bigbang-heatdeath-routes-stage5a.yml"
  pull_request:
    paths:
      - "api/gaiaos_app.py"
      - "api/Dockerfile"
      - "GaiaOS/SystemsOS/Core/MemoryOS/Runtime/GAIAOS-MEMORY.v1.py"
      - "tests/test_bigbang_heatdeath_routes_stage5a.py"
      - "GaiaOS/Plans/BIGBANG-HEATDEATH-STAGE5A-ROUTE-WIRING.v1.md"
      - ".github/workflows/gaiaos-bigbang-heatdeath-routes-stage5a.yml"
  workflow_dispatch:

jobs:
  primary-frontdoor-and-memoryos-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install normal carrier test dependencies
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile carrier/gateway routes and test suite
        run: |
          python -m py_compile api/gaiaos_app.py api/memcon_entrypoint.py api/gaiaos_memory_gateway.py
          python -m py_compile GaiaOS/SystemsOS/Core/MemoryOS/Runtime/GAIAOS-MEMORY.v1.py tests/test_bigbang_heatdeath_routes_stage5a.py
      - name: HEATDEATH legacy front-door default and actual MCP HTTP MemoryOS wiring
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_heatdeath_routes_stage5a.py" -v
      - name: Reprove independent gateway and read-only fallback
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_memory_gateway_stage3.py" -v
      - name: Reprove persistent emergency control and original legacy SQL
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_memory_mode_stage2.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_legacy_memory_baseline.py" -v
      - name: Source whitespace integrity
        run: git diff --check HEAD^1 HEAD
