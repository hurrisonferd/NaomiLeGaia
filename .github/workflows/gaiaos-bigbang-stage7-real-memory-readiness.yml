name: GaiaOS Stage 7 Real-Memory Readiness Gate

# One branch-scoped push check only. No automatic PR duplicate runs.
on:
  push:
    branches:
      - galaxy/stage7-real-memory-readiness-20260924
    paths:
      - api/gaiaos_bigbang_readiness.py
      - tests/test_bigbang_real_memory_readiness_stage7.py
      - .github/workflows/gaiaos-bigbang-stage7-real-memory-readiness.yml
  workflow_dispatch:

jobs:
  isolated-readiness-and-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install carrier test dependencies
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile readiness and tests
        run: python -m py_compile api/gaiaos_bigbang_readiness.py tests/test_bigbang_real_memory_readiness_stage7.py
      - name: Stage 7 focused tests
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_real_memory_readiness_stage7.py" -v
      - name: Existing BIGBANG and legacy safety regressions
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_operational_reader_stage6.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_memory_mode_stage2.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_legacy_memory_baseline.py" -v
