name: GaiaOS BIGBANG Stage 6 Operational Reader Gate

on:
  push:
    paths:
      - "api/galaxy_frontdoor_context.py"
      - "tests/test_bigbang_operational_reader_stage6.py"
      - "GaiaOS/Plans/BIGBANG-STAGE6-OPERATIONAL-READER.v1.md"
      - ".github/workflows/gaiaos-bigbang-stage6-operational-reader.yml"
  pull_request:
    paths:
      - "api/galaxy_frontdoor_context.py"
      - "tests/test_bigbang_operational_reader_stage6.py"
      - "GaiaOS/Plans/BIGBANG-STAGE6-OPERATIONAL-READER.v1.md"
      - ".github/workflows/gaiaos-bigbang-stage6-operational-reader.yml"
  workflow_dispatch:

jobs:
  operational-source-and-full-heatdeath-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install normal and recovery test dependencies
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile operational reader and gateway test
        run: |
          python -m py_compile api/galaxy_frontdoor_context.py api/galaxy_phase3_exit.py api/gaiaos_memory_gateway.py
          python -m py_compile tests/test_bigbang_operational_reader_stage6.py
      - name: Test stage-6 true operational reader and mocked BIGBANG plus fallback
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_operational_reader_stage6.py" -v
      - name: Repeat original legacy opt-in front-door preview tests
        run: PYTHONPATH=api python -m unittest discover -s tests -p "test_galaxy_frontdoor_integration.py" -v
      - name: Repeat HEATDEATH full-route research veto and normal boot
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p "test_heatdeath_stage5d_research_policy.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_heatdeath_stage5c_normal_boot.py" -v
      - name: Repeat normal chat, real MCP/HTTP, recovery and baseline tests
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_heatdeath_browser_stage5b.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_bigbang_heatdeath_routes_stage5a.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_heatdeath_legacy_recovery_stage4.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_memory_gateway_stage3.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_gaiaos_memory_mode_stage2.py" -v
          PYTHONPATH=api python -m unittest discover -s tests -p "test_legacy_memory_baseline.py" -v
      - name: Verify both independent Docker image builds
        run: |
          docker build --file api/Dockerfile --tag gaiaos-normal:stage6 .
          docker build --file api/Dockerfile.legacy-recovery --build-arg RECOVERY_SOURCE_COMMIT="$GITHUB_SHA" --tag gaiaos-heatdeath-recovery:stage6 .
          docker run --rm --entrypoint python -e MEMCONOS_DB_PATH=/tmp/gaiaos-stage6.sqlite gaiaos-normal:stage6 -c "import galaxy_frontdoor_context as g; import gaiaos_memory_gateway as m; assert callable(g.operational) and m.GALAXY_SCHEMA == g.SCHEMA; print('OPERATIONAL_READER_NORMAL_IMAGE_PASS')"
          docker run --rm --entrypoint python gaiaos-heatdeath-recovery:stage6 -c "import sys, gaiaos_legacy_recovery_app as a; assert a.SERVICE == 'gaiaos-legacy-recovery'; assert not any(n.startswith('galaxy_') for n in sys.modules); print('LEGACY_RECOVERY_IMAGE_INDEPENDENT_PASS')"
      - name: Source whitespace integrity
        run: git diff --check HEAD^1 HEAD
