name: GaiaOS Behavioral Integrity Patch Canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'GaiaOS/Apps/ChatOS/Protocols/**'
      - 'GaiaOS/Apps/ChatOS/Runtime/GAIAOS-SOAK-COMPILER.v1.py'
      - 'GaiaOS/Apps/ChatOS/Tests/GAIAOS-BEHAVIORAL-INTEGRITY-CANARY.py'
      - 'GaiaOS/SystemsOS/Core/FairyOS/BEHAVIORAL-INTEGRITY-FOUR-TENETS.v1.md'
      - 'GaiaOS/SystemsOS/Core/FairyOS/VERA-RECORDS/PATCH-NOTES/**'
  push:
    branches: [main]
    paths:
      - 'GaiaOS/Apps/ChatOS/Protocols/**'
      - 'GaiaOS/Apps/ChatOS/Runtime/GAIAOS-SOAK-COMPILER.v1.py'
      - 'GaiaOS/Apps/ChatOS/Tests/GAIAOS-BEHAVIORAL-INTEGRITY-CANARY.py'
      - 'GaiaOS/SystemsOS/Core/FairyOS/BEHAVIORAL-INTEGRITY-FOUR-TENETS.v1.md'

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check behavioral patch source and bounded SOAK candidate
        run: python GaiaOS/Apps/ChatOS/Tests/GAIAOS-BEHAVIORAL-INTEGRITY-CANARY.py
      - name: Existing anti-drift canary
        run: python GaiaOS/Apps/ChatOS/Tests/GAIAOS-ANTI-DRIFT-CANARY.py
