name: GaiaOS Wave 8 Front Door Settlement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gaiaos-wave8-frontdoor-settle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-fastmcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move MCP guidance to FastMCP construction
        shell: python
        run: |
          from pathlib import Path

          base_path = Path('api/gaiaos_api.py')
          base = base_path.read_text(encoding='utf-8')
          old = '''    instructions=(
              "Canonical GaiaOS source loader and council surface. load_gaiaos retrieves the current "
              "GaiaOS bootstrap, gaia_council retrieves the full source-backed council packet, "
              "gaia_dispatch deterministically resolves explicit typed signals through the current "
              "FairyOS matrix, gaia_operator retrieves one current operator profile, and gaia_brain "
              "returns the current Gaia-native cognitive support and continuity contracts. These tools "
              "are read-only and do not claim domain effects, durable memory, or automatic identity adoption."
          ),'''
          new = '''    instructions=(
              "GaiaOS is Naomi's read-only source-backed support carrier. For ordinary requests, "
              "use gaia(request) as the PRIMARY FRONT DOOR. It returns bounded context, conservative "
              "Gaia-native council routing, source binding, authority, and proof limits in one compact packet. "
              "Use gaia_selftest for diagnostics. Use load_gaiaos, gaia_council, gaia_brain, gaia_context, "
              "gaia_dispatch, and gaia_operator only for explicit deep inspection or debugging. Do not make "
              "Naomi or Raven manually orchestrate subsystem tools when gaia() is sufficient. These tools are "
              "read-only support surfaces; dispatch is not execution, WARM is not saved, and Naomi retains final authority."
          ),'''
          if old not in base and 'use gaia(request) as the PRIMARY FRONT DOOR' not in base:
              raise SystemExit('FastMCP construction instruction block not found')
          if old in base:
              base = base.replace(old, new, 1)
          base_path.write_text(base, encoding='utf-8')

          app_path = Path('api/gaiaos_app.py')
          app = app_path.read_text(encoding='utf-8')
          old_setter = '''mcp.instructions = (
              "GaiaOS is Naomi's read-only source-backed support carrier. For ordinary requests, "
              "use gaia(request) as the PRIMARY FRONT DOOR. It returns bounded context, conservative "
              "Gaia-native council routing, source binding, authority, and proof limits in one compact packet. "
              "Use gaia_selftest for diagnostics. Use load_gaiaos, gaia_council, gaia_brain, gaia_context, "
              "gaia_dispatch, and gaia_operator only for explicit deep inspection or debugging. Do not make "
              "Naomi or Raven manually orchestrate those tools when gaia() is sufficient. Naomi retains final authority."
          )
          '''
          replacement = '''# PRIMARY FRONT DOOR instructions are defined when FastMCP is constructed in
          # gaiaos_api.py. FastMCP 1.30 exposes instructions as a read-only property.
          '''
          if old_setter in app:
              app = app.replace(old_setter, replacement, 1)
          elif 'mcp.instructions =' in app:
              raise SystemExit('Unexpected FastMCP instructions setter shape')
          app_path.write_text(app, encoding='utf-8')

      - name: Compile repaired carrier
        run: |
          python -m py_compile api/gaiaos_api.py api/gaiaos_app.py
      - name: Commit startup repair
        run: |
          git config user.name 'GaiaOS Proof Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/gaiaos_api.py api/gaiaos_app.py
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'Fix GaiaOS 1.6 FastMCP startup instructions'
          git push
