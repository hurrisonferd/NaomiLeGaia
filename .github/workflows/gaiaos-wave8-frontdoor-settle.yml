name: GaiaOS Wave 8 Front Door Settlement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gaiaos-wave8-frontdoor-settle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-fastmcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Repair FastMCP 1.30 instruction wiring
        shell: python
        run: |
          import re
          from pathlib import Path

          base_path = Path('api/gaiaos_api.py')
          base = base_path.read_text(encoding='utf-8')
          instruction_block = '''instructions=(
              "GaiaOS is Naomi's read-only source-backed support carrier. For ordinary requests, "
              "use gaia(request) as the PRIMARY FRONT DOOR. It returns bounded context, conservative "
              "Gaia-native council routing, source binding, authority, and proof limits in one compact packet. "
              "Use gaia_selftest for diagnostics. Use load_gaiaos, gaia_council, gaia_brain, gaia_context, "
              "gaia_dispatch, and gaia_operator only for explicit deep inspection or debugging. Do not make "
              "Naomi or Raven manually orchestrate subsystem tools when gaia() is sufficient. These tools are "
              "read-only support surfaces; dispatch is not execution, WARM is not saved, and Naomi retains final authority."
          ),'''
          if 'use gaia(request) as the PRIMARY FRONT DOOR' not in base:
              pattern = r'instructions=\(.*?\),\n\s*stateless_http=True,'
              replacement = instruction_block + '\n    stateless_http=True,'
              base, count = re.subn(pattern, replacement, base, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit('Could not replace FastMCP construction instructions')
          base_path.write_text(base, encoding='utf-8')

          app_path = Path('api/gaiaos_app.py')
          app = app_path.read_text(encoding='utf-8')
          pattern = r'mcp\.instructions\s*=\s*\(.*?\)\n(?=app\.version\s*=\s*EXTENSION_VERSION)'
          replacement = (
              '# PRIMARY FRONT DOOR instructions are defined when FastMCP is constructed in\n'
              '# gaiaos_api.py. FastMCP 1.30 exposes instructions as a read-only property.\n'
          )
          app, count = re.subn(pattern, replacement, app, count=1, flags=re.S)
          if count != 1 and 'mcp.instructions =' in app:
              raise SystemExit('Could not remove FastMCP instructions setter')
          if 'mcp.instructions =' in app:
              raise SystemExit('FastMCP instructions setter still present')
          app_path.write_text(app, encoding='utf-8')

      - name: Compile repaired carrier
        run: python -m py_compile api/gaiaos_api.py api/gaiaos_app.py
      - name: Commit startup repair
        run: |
          git config user.name 'GaiaOS Proof Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add api/gaiaos_api.py api/gaiaos_app.py
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'Fix GaiaOS 1.6 FastMCP startup instructions'
          git push
