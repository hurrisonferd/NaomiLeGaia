name: GaiaOS Hard External Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gaiaos-hard-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hard-smoke:
    name: Hammer live HTTP and MCP surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install MCP client
        run: python -m pip install 'mcp>=1.27.2,<2' httpx
      - name: Hard acceptance
        shell: python
        run: |
          import asyncio
          import json
          import time
          from collections import Counter

          import httpx
          from mcp import ClientSession
          from mcp.client.streamable_http import streamable_http_client

          BASE = 'https://gaiaos-loader-api.onrender.com'
          MCP = BASE + '/mcp'
          ROSTER = ['VERA', 'ANVIL', 'SELENE', 'ORIN', 'KESTREL', 'NIMUE']
          EXPECTED_TOOLS = {
              'load_gaiaos', 'gaia_council', 'gaia_dispatch',
              'gaia_operator', 'gaia_brain', 'gaia_context'
          }

          def size(value):
              return len(json.dumps(value, ensure_ascii=False, separators=(',', ':')).encode())

          def tool_payload(result):
              payload = getattr(result, 'structuredContent', None)
              if payload is None:
                  payload = getattr(result, 'structured_content', None)
              if isinstance(payload, dict):
                  return payload
              for block in getattr(result, 'content', []) or []:
                  text = getattr(block, 'text', None)
                  if isinstance(text, str):
                      try:
                          value = json.loads(text)
                      except json.JSONDecodeError:
                          continue
                      if isinstance(value, dict):
                          return value
              raise AssertionError('tool returned no parseable object payload')

          async def http_acceptance():
              async with httpx.AsyncClient(timeout=30, follow_redirects=True) as client:
                  # Wake/retry carrier first.
                  health = None
                  for attempt in range(24):
                      try:
                          r = await client.get(BASE + '/health')
                          if r.status_code == 200:
                              health = r.json()
                              break
                      except Exception:
                          pass
                      await asyncio.sleep(5)
                  assert health is not None, 'carrier never became healthy'
                  assert health['status'] == 'ok'
                  assert health['mcp_endpoint'] == '/mcp'
                  print('HTTP_HEALTH', json.dumps(health, sort_keys=True))

                  routes = {}
                  for name, method, path, kwargs in [
                      ('load', 'GET', '/gaiaos/load', {}),
                      ('council', 'GET', '/gaiaos/council', {}),
                      ('brain', 'GET', '/gaiaos/brain', {}),
                      ('context', 'GET', '/gaiaos/context', {'params': {'subject': 'council operator', 'limit': 7, 'depth': 2}}),
                      ('dispatch', 'POST', '/gaiaos/dispatch', {'json': {'signals': ['FRAME','PROOF_EDGE','NEXT_STEP'], 'requested_members': [], 'max_members': 3}}),
                  ]:
                      r = await client.request(method, BASE + path, **kwargs)
                      assert r.status_code == 200, (name, r.status_code, r.text[:500])
                      routes[name] = r.json()
                      print('HTTP_SIZE', name, size(routes[name]))

                  sources = []
                  sources.append(routes['load']['gaiaos']['source'])
                  for name in ['council','brain','context','dispatch']:
                      sources.append(routes[name]['source'])
                  assert len(set(sources)) == 1, sources
                  print('HTTP_SOURCE', sources[0])

                  selected = [x['member'] for x in routes['dispatch']['selected']]
                  assert selected == ['KESTREL','VERA','ANVIL'], selected
                  assert routes['dispatch']['authority'] == 'NAOMI'
                  assert routes['dispatch']['unknown_signals'] == []
                  assert routes['context']['source_binding'] == 'DEPLOYED_CHECKOUT'

                  profiles = {}
                  for member in ROSTER:
                      r = await client.get(BASE + f'/gaiaos/operator/{member.lower()}')
                      assert r.status_code == 200, (member, r.status_code, r.text[:300])
                      p = r.json()
                      assert p['member'] == member
                      assert p['source'] == sources[0]
                      profiles[member] = p
                  assert len({json.dumps(v['profile'], sort_keys=True) for v in profiles.values()}) == len(ROSTER)
                  print('HTTP_OPERATORS_OK', ','.join(ROSTER))

                  # Negative/boundary behavior.
                  r = await client.get(BASE + '/gaiaos/operator/NOPE')
                  assert r.status_code == 404, r.status_code
                  r = await client.get(BASE + '/gaiaos/context', params={'subject': ''})
                  assert r.status_code == 422, r.status_code
                  r = await client.post(BASE + '/gaiaos/dispatch', json={'signals':['TOTALLY_UNKNOWN'], 'requested_members':['NOPE'], 'max_members':1})
                  assert r.status_code == 200, r.text
                  unknown = r.json()
                  assert unknown['unknown_signals'] == ['TOTALLY_UNKNOWN']
                  assert unknown['unknown_requested_members'] == ['NOPE']
                  assert unknown['selected'] == []
                  r = await client.post(BASE + '/gaiaos/dispatch', json={'signals':['FRAME'], 'requested_members':['NIMUE'], 'max_members':1})
                  assert r.status_code == 200
                  explicit = r.json()
                  assert [x['member'] for x in explicit['selected']] == ['NIMUE'], explicit['selected']
                  r = await client.post(BASE + '/gaiaos/dispatch', json={'signals':['FRAME'], 'max_members':0})
                  assert r.status_code == 422, r.status_code

                  # Hosted /chat must be truthful about whether its own model backend exists.
                  r = await client.post(BASE + '/chat', json={'messages':[{'role':'user','content':'hello'}]})
                  if health.get('openai_configured'):
                      assert r.status_code in (200, 401), r.status_code
                  else:
                      assert r.status_code == 503, (r.status_code, r.text[:300])
                  print('HTTP_CHAT_BOUNDARY_OK', r.status_code)

                  # Small burst test across read-only routes.
                  urls = [
                      BASE + '/health',
                      BASE + '/gaiaos/context?subject=council',
                      BASE + '/gaiaos/operator/VERA',
                      BASE + '/gaiaos/operator/NIMUE',
                  ] * 5
                  results = await asyncio.gather(*(client.get(url) for url in urls))
                  counts = Counter(r.status_code for r in results)
                  assert counts == {200: len(results)}, counts
                  print('HTTP_BURST_OK', dict(counts))

                  return sources[0], {k:size(v) for k,v in routes.items()}

          async def mcp_acceptance(expected_source):
              async with streamable_http_client(MCP) as transport:
                  read_stream, write_stream = transport[0], transport[1]
                  async with ClientSession(read_stream, write_stream) as session:
                      initialized = await session.initialize()
                      server = initialized.serverInfo.name if hasattr(initialized, 'serverInfo') else initialized.server_info.name
                      assert server == 'GaiaOS Carrier', server
                      tools = await session.list_tools()
                      names = {t.name for t in tools.tools}
                      assert EXPECTED_TOOLS <= names, names
                      print('MCP_TOOLS', sorted(names))

                      calls = {}
                      calls['load'] = tool_payload(await session.call_tool('load_gaiaos', arguments={}))
                      calls['council'] = tool_payload(await session.call_tool('gaia_council', arguments={}))
                      calls['brain'] = tool_payload(await session.call_tool('gaia_brain', arguments={}))
                      calls['context'] = tool_payload(await session.call_tool('gaia_context', arguments={'subject':'council operator','limit':7,'depth':2}))
                      calls['dispatch'] = tool_payload(await session.call_tool('gaia_dispatch', arguments={'signals':['FRAME','PROOF_EDGE','NEXT_STEP'],'requested_members':[],'max_members':3}))

                      mcp_sources = [calls['load']['gaiaos']['source']] + [calls[x]['source'] for x in ['council','brain','context','dispatch']]
                      assert len(set(mcp_sources)) == 1, mcp_sources
                      assert mcp_sources[0] == expected_source, (mcp_sources[0], expected_source)
                      assert [x['member'] for x in calls['dispatch']['selected']] == ['KESTREL','VERA','ANVIL']
                      assert calls['context']['source_binding'] == 'DEPLOYED_CHECKOUT'

                      for member in ROSTER:
                          p = tool_payload(await session.call_tool('gaia_operator', arguments={'member':member.lower()}))
                          assert p['member'] == member
                          assert p['source'] == expected_source

                      unknown = tool_payload(await session.call_tool('gaia_dispatch', arguments={'signals':['TOTALLY_UNKNOWN'],'requested_members':['NOPE'],'max_members':1}))
                      assert unknown['unknown_signals'] == ['TOTALLY_UNKNOWN']
                      assert unknown['unknown_requested_members'] == ['NOPE']
                      assert unknown['selected'] == []

                      explicit = tool_payload(await session.call_tool('gaia_dispatch', arguments={'signals':['FRAME'],'requested_members':['NIMUE'],'max_members':1}))
                      assert [x['member'] for x in explicit['selected']] == ['NIMUE']

                      print('MCP_SIZES', json.dumps({k:size(v) for k,v in calls.items()}, sort_keys=True))
                      print('GAIAOS_HARD_MCP_PASS')

          async def main():
              source, sizes = await http_acceptance()
              print('HTTP_SIZES', json.dumps(sizes, sort_keys=True))
              await mcp_acceptance(source)
              print('GAIAOS_HARD_EXTERNAL_ACCEPTANCE_PASS')

          asyncio.run(main())
