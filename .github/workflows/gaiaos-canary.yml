name: GaiaOS Canary

on:
  push:
    branches: [main]
    paths:
      - 'GaiaOS/**'
      - 'api/**'
      - 'GAIAOS-LOAD.md'
      - '.github/workflows/gaiaos-canary.yml'
  pull_request:
    paths:
      - 'GaiaOS/**'
      - 'api/**'
      - 'GAIAOS-LOAD.md'
      - '.github/workflows/gaiaos-canary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gaiaos-canary:
    name: GaiaOS source + FairyOS + ChatOS + council + presentation canaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run FairyOS dispatch canary
        run: python GaiaOS/SystemsOS/Core/FairyOS/Tests/GAIAOS-FAIRYOS-DISPATCH-CANARY.py
      - name: Run ChatOS canary
        run: python GaiaOS/Apps/ChatOS/Tests/CHATOS-CANARY.py
      - name: Run council dissent canary
        run: python GaiaOS/Apps/ChatOS/Tests/GAIAOS-COUNCIL-DISSENT-CANARY.py
      - name: Run presentation gold canary
        run: python GaiaOS/Apps/ChatOS/Tests/GAIAOS-PRESENTATION-CANARY.py
      - name: Compile GaiaOS carrier API
        run: python -m py_compile api/gaiaos_api.py
      - name: Verify council carrier source surface
        shell: python
        run: |
          from pathlib import Path

          api = Path('api/gaiaos_api.py').read_text(encoding='utf-8')
          openapi = Path('api/openapi.yaml').read_text(encoding='utf-8')
          current = Path('GaiaOS/CURRENT.json').read_text(encoding='utf-8')
          commands = Path('GaiaOS/Apps/ChatOS/Protocols/GAIAOS-COUNCIL-COMMANDS.v1.md').read_text(encoding='utf-8')
          presentation = Path('GaiaOS/Apps/ChatOS/Protocols/GAIAOS-PRESENTATION-GOLD.v1.md').read_text(encoding='utf-8')

          required_api = [
              'def gaia_council(',
              'def gaia_dispatch(',
              'def gaia_operator(',
              '@app.get("/gaiaos/council"',
              '@app.post("/gaiaos/dispatch"',
              '@app.get("/gaiaos/operator/{member}"',
          ]
          required_openapi = [
              '/gaiaos/council:',
              '/gaiaos/dispatch:',
              '/gaiaos/operator/{member}:',
          ]
          required_commands = [
              'COUNCIL [subject]',
              'COUNCIL EVERYONE [subject]',
              'COUNCIL ROOM [subject]',
              'CAST <N> [subject]',
              'GAIAOS LIVING',
              'GAIAOS QUIET',
              'GAIAOS WILD',
          ]
          required_presentation = [
              'HUMOR MUST EARN ITS CHAIR.',
              'PRESENTATION ENERGY != EVIDENCE',
              'RAVEN META GOBLIN != GAIA REQUIRED CADENCE',
          ]

          missing = []
          missing += [f'api:{x}' for x in required_api if x not in api]
          missing += [f'openapi:{x}' for x in required_openapi if x not in openapi]
          missing += [f'commands:{x}' for x in required_commands if x not in commands]
          missing += [f'presentation:{x}' for x in required_presentation if x not in presentation]
          if 'v0.001.002' not in current:
              missing.append('current:v0.001.002')
          if 'APP_VERSION = "1.4.0"' not in api:
              missing.append('api:APP_VERSION=1.4.0')

          if missing:
              raise SystemExit('GAIAOS_COUNCIL_CARRIER_CANARY_FAIL ' + ', '.join(missing))
          print('GAIAOS_COUNCIL_CARRIER_CANARY_PASS')
