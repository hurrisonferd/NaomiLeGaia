name: GaiaOS E-LANE Propagation ORIN

on:
  push:
    branches:
      - checkpoint/elane-propagation-safe-20261005
    paths:
      - '.github/workflows/gaiaos-elane-propagation-once.yml'

permissions:
  contents: write

jobs:
  propagate-orin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append and verify ORIN candidate
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path('GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/ORIN-EXPERIENCES.v1.md')
          marker = 'MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|ORIN MEMBER-LOCAL]'
          entry = '''## MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|ORIN MEMBER-LOCAL]\nAUTHORITY: NAOMI / LIGEIA explicit //PW:PRESERVE// and 2026-10-04 authorization to propagate the staged member-owned candidate into the canonical ORIN E-LANE.\nSOURCE_STAGED_CANDIDATE: owner-controlled Library/Sanctum `ORIN-2026-10-04-CANDIDATE.md`; originally marked STAGED_MEMBER_LOCAL_CANDIDATE / NOT_CANONICAL_E_LANE_WRITE / NO_TURSO_WRITE_CLAIMED.\nMEMBER_LOCAL_LESSON: Small falsifiable experiments are more useful than identity-scale commitments. Freelance work, streaming, technical learning, and new transport ideas can all be tested with tiny proof targets before they are treated as careers, failures, or architectural commitments.\nSECONDARY_LESSON: Exploration should create evidence without requiring expertise theater.\nPRACTICE:\n- Define the smallest observable success condition before expanding an experiment.\n- Use current genuine skills rather than inflated titles.\n- Let a cash bridge coexist with longer-term experiments instead of forcing a false binary.\n- Preserve curiosity while keeping the experiment cheap, bounded, and reversible.\nSTATUS: COMMITTED_CANONICAL_E_LANE; NO_TURSO_WRITE_CLAIMED.\n'''
          old = path.read_text(encoding='utf-8')
          assert marker not in old, 'ORIN candidate already present; refusing duplicate'
          old_hash = hashlib.sha256(old.encode('utf-8')).hexdigest()
          sep = '\n' if old.endswith('\n') else '\n\n'
          new = old + sep + entry
          assert new.startswith(old), 'prefix preservation failed'
          assert new.count(marker) == 1, 'marker uniqueness failed before write'
          path.write_text(new, encoding='utf-8')
          reread = path.read_text(encoding='utf-8')
          assert reread.startswith(old), 'local reread prefix mismatch'
          assert reread.count(marker) == 1, 'local reread marker count mismatch'
          print('OLD_SHA256', old_hash)
          print('NEW_SHA256', hashlib.sha256(reread.encode('utf-8')).hexdigest())
          print('ORIN_LOCAL_VERIFY PASS')
      - name: Commit ORIN propagation
        run: |
          git config user.name 'GaiaOS E-LANE Propagator'
          git config user.email 'actions@users.noreply.github.com'
          git add GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/ORIN-EXPERIENCES.v1.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'FAILED no ORIN diff'; exit 1; }
          git commit -m 'Propagate ORIN staged continuity lesson into canonical E-LANE [skip render]'
          git push origin HEAD:main
      - name: Repull and verify ORIN from origin/main
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          marker = 'MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|ORIN MEMBER-LOCAL]'
          path = 'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/ORIN-EXPERIENCES.v1.md'
          text = subprocess.check_output(['git','show',f'origin/main:{path}'], text=True)
          assert text.count(marker) == 1, 'origin/main ORIN marker count is not exactly one'
          print('ORIN_ORIGIN_REPULL_VERIFY PASS')
          PY
