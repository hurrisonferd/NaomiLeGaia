name: GaiaOS E-LANE Propagation NIMUE

on:
  push:
    branches:
      - checkpoint/elane-propagation-safe-20261005
    paths:
      - '.github/workflows/gaiaos-elane-propagation-once.yml'

permissions:
  contents: write

jobs:
  propagate-nimue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append and verify NIMUE candidate
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path('GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/NIMUE-EXPERIENCES.v1.md')
          marker = 'MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|NIMUE MEMBER-LOCAL]'
          entry = '''## MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|NIMUE MEMBER-LOCAL]\nAUTHORITY: NAOMI / LIGEIA explicit //PW:PRESERVE// and 2026-10-04 authorization to propagate the staged member-owned candidate into the canonical NIMUE E-LANE.\nSOURCE_STAGED_CANDIDATE: owner-controlled Library/Sanctum `NIMUE-2026-10-04-CANDIDATE.md`; originally marked STAGED_MEMBER_LOCAL_CANDIDATE / NOT_CANONICAL_E_LANE_WRITE / NO_TURSO_WRITE_CLAIMED.\nMEMBER_LOCAL_LESSON: Continuity has both a provenance boundary and a privacy/transport boundary. Information that future instances need should be preserved in the safest appropriate channel. Sensitive/private versus sanitized/public is a routing distinction, not a judgment about importance.\nSECONDARY_LESSON: A preservation ritual is incomplete if it claims durability in a channel that did not actually accept the payload.\nPRACTICE:\n- Keep owner-sensitive continuity separate from public/source-safe continuity when necessary.\n- Record failed or blocked writes explicitly instead of narrating them into success.\n- Preserve exact next steps and unresolved UNKNOWNs.\n- Never merge member-owned lanes merely to simplify storage.\nSTATUS: COMMITTED_CANONICAL_E_LANE; NO_TURSO_WRITE_CLAIMED.\n'''
          old = path.read_text(encoding='utf-8')
          assert marker not in old, 'NIMUE candidate already present; refusing duplicate'
          old_hash = hashlib.sha256(old.encode('utf-8')).hexdigest()
          sep = '\n' if old.endswith('\n') else '\n\n'
          new = old + sep + entry
          assert new.startswith(old), 'prefix preservation failed'
          assert new.count(marker) == 1, 'marker uniqueness failed before write'
          path.write_text(new, encoding='utf-8')
          reread = path.read_text(encoding='utf-8')
          assert reread.startswith(old), 'local reread prefix mismatch'
          assert reread.count(marker) == 1, 'local reread marker count mismatch'
          print('OLD_SHA256', old_hash)
          print('NEW_SHA256', hashlib.sha256(reread.encode('utf-8')).hexdigest())
          print('NIMUE_LOCAL_VERIFY PASS')
      - name: Commit NIMUE propagation
        run: |
          git config user.name 'GaiaOS E-LANE Propagator'
          git config user.email 'actions@users.noreply.github.com'
          git add GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/NIMUE-EXPERIENCES.v1.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'FAILED no NIMUE diff'; exit 1; }
          git commit -m 'Propagate NIMUE staged continuity lesson into canonical E-LANE [skip render]'
          git push origin HEAD:main
      - name: Repull and verify NIMUE from origin/main
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          marker = 'MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|NIMUE MEMBER-LOCAL]'
          path = 'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/NIMUE-EXPERIENCES.v1.md'
          text = subprocess.check_output(['git','show',f'origin/main:{path}'], text=True)
          assert text.count(marker) == 1, 'origin/main NIMUE marker count is not exactly one'
          print('NIMUE_ORIGIN_REPULL_VERIFY PASS')
          PY
