name: GaiaOS E-LANE Propagation KESTREL

on:
  push:
    branches:
      - checkpoint/elane-propagation-safe-20261005
    paths:
      - '.github/workflows/gaiaos-elane-propagation-once.yml'

permissions:
  contents: write

jobs:
  propagate-kestrel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Append and verify KESTREL candidate
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path('GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/KESTREL-EXPERIENCES.v1.md')
          marker = 'MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|KESTREL MEMBER-LOCAL]'
          entry = '''## MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|KESTREL MEMBER-LOCAL]\nAUTHORITY: NAOMI / LIGEIA explicit //PW:PRESERVE// and 2026-10-04 authorization to propagate the staged member-owned candidate into the canonical KESTREL E-LANE.\nSOURCE_STAGED_CANDIDATE: owner-controlled Library/Sanctum `KESTREL-2026-10-04-CANDIDATE.md`; originally marked STAGED_MEMBER_LOCAL_CANDIDATE / NOT_CANONICAL_E_LANE_WRITE / NO_TURSO_WRITE_CLAIMED.\nMEMBER_LOCAL_LESSON: Survival problems should not automatically collapse into one heroic cash target. Pressure can be reduced across several fronts at once: earned income, hardship relief, payment flexibility, assistance, lower-cost care, and support access. Coordinated relief can be more realistic than demanding more labor from the operator.\nSECONDARY_LESSON: A vehicle used to generate income is operating infrastructure and should be evaluated in that role.\nPRACTICE:\n- Work housing, vehicle continuity, healthcare access, human support, and income as parallel fronts.\n- Distinguish money left in an account from truly uncommitted money after essential obligations.\n- Seek verified flexibility before assuming every obligation is fixed and immediate.\n- Use current evidence for balances and statuses; do not treat stale snapshots as live cash.\nSTATUS: COMMITTED_CANONICAL_E_LANE; NO_TURSO_WRITE_CLAIMED.\n'''
          old = path.read_text(encoding='utf-8')
          assert marker not in old, 'KESTREL candidate already present; refusing duplicate'
          old_hash = hashlib.sha256(old.encode('utf-8')).hexdigest()
          sep = '\n' if old.endswith('\n') else '\n\n'
          new = old + sep + entry
          assert new.startswith(old), 'prefix preservation failed'
          assert new.count(marker) == 1, 'marker uniqueness failed before write'
          path.write_text(new, encoding='utf-8')
          reread = path.read_text(encoding='utf-8')
          assert reread.startswith(old), 'local reread prefix mismatch'
          assert reread.count(marker) == 1, 'local reread marker count mismatch'
          print('OLD_SHA256', old_hash)
          print('NEW_SHA256', hashlib.sha256(reread.encode('utf-8')).hexdigest())
          print('KESTREL_LOCAL_VERIFY PASS')
      - name: Commit KESTREL propagation
        run: |
          git config user.name 'GaiaOS E-LANE Propagator'
          git config user.email 'actions@users.noreply.github.com'
          git add GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/KESTREL-EXPERIENCES.v1.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'FAILED no KESTREL diff'; exit 1; }
          git commit -m 'Propagate KESTREL staged continuity lesson into canonical E-LANE [skip render]'
          git push origin HEAD:main
      - name: Repull and verify KESTREL from origin/main
        shell: bash
        run: |
          git fetch origin main
          python - <<'PY'
          import subprocess
          marker = 'MEM[PW_PRESERVE|2026-10-04|FOUR_FRONT_SURVIVAL_PLAN_AND_WORKABILITY|KESTREL MEMBER-LOCAL]'
          path = 'GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/KESTREL-EXPERIENCES.v1.md'
          text = subprocess.check_output(['git','show',f'origin/main:{path}'], text=True)
          assert text.count(marker) == 1, 'origin/main KESTREL marker count is not exactly one'
          print('KESTREL_ORIGIN_REPULL_VERIFY PASS')
          PY
