name: GaiaOS Stage 8 Deployment Parity Gate
# PR-only: avoid duplicate push and pull-request notification runs.
on:
  pull_request:
    paths:
      - api/gaiaos_api.py
      - api/gaiaos_stage9f_deployment_verify.py
      - render.yaml
      - tests/test_gaiaos_health_release_proof_stage8.py
      - tests/test_gaiaos_stage9f_deployment_verify.py
      - tests/test_gaiaos_console_browser_contract.py
      - .github/workflows/gaiaos-stage8-deployment-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-proof-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original carrier dependencies
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile stage8 contract
        run: python -m py_compile api/gaiaos_api.py api/gaiaos_stage9f_deployment_verify.py tests/test_gaiaos_health_release_proof_stage8.py tests/test_gaiaos_stage9f_deployment_verify.py
      - name: Verify actual served Render console JavaScript and every button handler
        run: |
          node --version
          PYTHONPATH=api python -m unittest discover -s tests -p test_gaiaos_console_browser_contract.py -v
      - name: Verify health reports deployed revision without data access
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p test_gaiaos_health_release_proof_stage8.py -v
          PYTHONPATH=api python -m unittest discover -s tests -p test_gaiaos_stage9f_deployment_verify.py -v
