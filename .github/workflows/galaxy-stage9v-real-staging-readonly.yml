name: GALAXY Stage 9V Real Staging Read-Only Owner Gate

# Intentionally NO pull_request, push, schedule or workflow_run trigger.
# Eligible only after this workflow is reviewed and merged onto main.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Run TWO staging-only SELECTs; no canary writes"
        required: true
        type: choice
        options:
          - ABORT
          - STAGING_READ_ONLY
        default: ABORT

permissions:
  contents: read

concurrency:
  group: gaiaos-stage9v-real-staging-readiness
  cancel-in-progress: false

jobs:
  verify-readonly-staging:
    if: >-
      github.repository == 'hurrisonferd/NaomiLeGaia' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Ligeia621' &&
      inputs.confirmation == 'STAGING_READ_ONLY'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Owner MUST manually configure this environment's required reviewers and
    # four secrets before dispatch. A name alone is not a protection policy.
    environment: gaiaos-stage9v-read-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local Python driver without private config
        run: python -m pip install "libsql>=0.1,<1.0"
      - name: Stage 9V actual remote identity and canary-table SELECT only
        env:
          GAIAOS_STAGE9V_STAGING_URL: ${{ secrets.GAIAOS_STAGE9V_STAGING_URL }}
          GAIAOS_STAGE9V_STAGING_TOKEN: ${{ secrets.GAIAOS_STAGE9V_STAGING_TOKEN }}
          GAIAOS_STAGE9V_PRODUCTION_URL: ${{ secrets.GAIAOS_STAGE9V_PRODUCTION_URL }}
          GAIAOS_STAGE9V_STAGING_UUID: ${{ secrets.GAIAOS_STAGE9V_STAGING_UUID }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          set +e
          python api/galaxy_stage9v_operator_preflight.py --confirm-read-only > "$RUNNER_TEMP/stage9v-private-report.json"
          preflight_exit=$?
          set -e
          # Export only an allowlisted JSON receipt, never the raw report.
          python api/galaxy_stage9v_readiness_receipt.py \
            --report "$RUNNER_TEMP/stage9v-private-report.json" \
            --output "$RUNNER_TEMP/stage9v-public-receipt.json" \
            --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"
          test "$preflight_exit" -eq 0
      - name: Archive redacted evidence for owner review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9v-readonly-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/stage9v-public-receipt.json
          if-no-files-found: warn
          retention-days: 7
