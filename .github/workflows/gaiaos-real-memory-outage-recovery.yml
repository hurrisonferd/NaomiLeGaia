name: GaiaOS Actual Render Memory Outage Boot and Isolated Recovery

# No live Turso, source archive, private owner keys, OpenAI request, database
# migration, auto-merge, Render deploy, SOs cutover or BIGBANG activation.
on:
  push:
    paths:
      - "api/memcon_entrypoint.py"
      - "api/browser_memcon_bridge.py"
      - "api/gaiaos_api.py"
      - "tests/test_gaiaos_memory_outage_real_bridge.py"
      - ".github/workflows/gaiaos-real-memory-outage-recovery.yml"
  pull_request:
    paths:
      - "api/memcon_entrypoint.py"
      - "api/browser_memcon_bridge.py"
      - "api/gaiaos_api.py"
      - "tests/test_gaiaos_memory_outage_real_bridge.py"
      - ".github/workflows/gaiaos-real-memory-outage-recovery.yml"

permissions:
  contents: read

jobs:
  real-render-carrier-starts-without-memory-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing carrier plus real FastAPI HTTP client
        run: python -m pip install -r api/requirements.txt "httpx>=0.27,<1.0"
      - name: Compile actual boot adapter, Render entrypoint and fresh-process tests
        run: |
          python -m py_compile api/memcon_entrypoint.py \
            api/browser_memcon_bridge.py api/gaiaos_api.py \
            tests/test_gaiaos_memory_outage_real_bridge.py
      - name: Fresh process local and fake remote failures, signed generic recovery
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_gaiaos_memory_outage_real_bridge.py' -v
      - name: Preserve actual Render bridge, signed session, generic model and future synthetic GALAXY
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_actual_render_bridge_integration.py' -v
      - name: Preserve actual HTTP/MCP privacy and source-verified six-lane restrictions
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_galaxy_public_memory_read_boundary.py' -v
      - name: Preserve standalone legacy HEATDEATH recovery independence
        run: PYTHONPATH=api python -m unittest discover -s tests -p 'test_heatdeath_legacy_recovery_stage4.py' -v
      - name: Preserve read-only BIGBANG operational pilot and unmodified HEATDEATH gateway
        run: |
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_bigbang_operational_reader_stage6.py' -v
          PYTHONPATH=api python -m unittest discover -s tests -p 'test_gaiaos_memory_gateway_stage3.py' -v
      - name: Build actual production Dockerfile, NOT an alternate test app
        run: docker build -f api/Dockerfile -t gaiaos-actual-memory-outage:ci .
      - name: Actual built image starts OFFLINE without any reachable Turso DB
        run: |
          docker run --rm -i --network none \
            -e TURSO_DATABASE_URL=libsql://ci-never-connect.invalid \
            -e TURSO_AUTH_TOKEN=CI-FAKE-NEVER-REAL-CREDENTIAL \
            -e GAIAOS_API_KEY=CI-SIGNED-SESSION-NOT-AN-OWNER-KEY \
            -e OPENAI_API_KEY=CI-FAKE-NOT-A-PROVIDER-KEY \
            -e MEMCONOS_DB_PATH=/tmp/ci-must-not-exist.sqlite \
            -e RENDER_GIT_COMMIT=CI-NOT-A-DEPLOYED-REVISION \
            gaiaos-actual-memory-outage:ci python - <<'PY'
          from pathlib import Path
          from fastapi import HTTPException
          from fastapi.routing import APIRoute
          import memcon_runtime as store
          assert store.STORAGE_BACKEND=="turso_libsql"
          assert store._INITIALIZED is False
          calls=[]
          def down():
              calls.append("CI_BACKEND_UNAVAILABLE")
              raise OSError("CI-PRIVATE-NEVER-LEAK")
          store._db=down
          import browser_memcon_bridge as actual
          import memcon_entrypoint as entry
          import gaiaos_api as carrier
          import gaiaos_memory_mode as mode
          assert actual.app is entry.app
          assert calls == []
          assert store._INITIALIZED is False
          assert carrier.health()["status"]=="ok"
          assert calls == []
          assert mode.mode_status(store)["effective_mode"]=="HEATDEATH"
          routes=[r for r in actual.app.routes if isinstance(r, APIRoute)]
          assert len([r for r in routes if r.path=="/chat" and "POST" in r.methods])==1
          assert len([r for r in routes if r.path=="/chat/recovery"
                      and "POST" in r.methods])==1
          try:
              entry.memcon_health(
                  authorization="Bearer CI-SIGNED-SESSION-NOT-AN-OWNER-KEY"
              )
          except HTTPException as exc:
              assert exc.status_code==503
              assert exc.detail["status"]=="HOLD_STORAGE_UNAVAILABLE"
              assert exc.detail["backend"]=="turso_libsql"
              assert "CI-PRIVATE" not in str(exc.detail)
          else:
              raise AssertionError("A dead backend cannot be healthy")
          assert store._INITIALIZED is False
          assert not Path("/tmp/ci-must-not-exist.sqlite").exists()
          for private in ("galaxy_stage9ag_staging_historical_import",
                          "galaxy_stage9ah_signed_staging_rollback"):
              import importlib.util
              assert importlib.util.find_spec(private) is None
          print("PASS: actual Render image imported with unavailable fake "
                "remote backend; carrier alive, memory health HOLD, "
                "SOLO-safe explicit recovery route installed, "
                "no local fallback, owner migration scripts absent.")
          PY
      - name: Preserve six separate E-LANES and permanent preserve protocol
        run: |
          for member in VERA ANVIL SELENE ORIN KESTREL NIMUE; do
            test -f "GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/$member-EXPERIENCES.v1.md"
          done
          test ! -e GaiaOS/SystemsOS/Core/FairyOS/IDENTITY-DATA/VASKON-EXPERIENCES.v1.md
          grep -Fq '//PW:PRESERVE//' GaiaOS/Plans/PRESERVE-AND-SIX-E-LANES-PERMANENT-DESIGN-INVARIANT.v1.md
