name: GaiaOS Agency Workspace Evolution Memory Canary

on:
  push:
    paths:
      - "GaiaOS/SystemsOS/Core/AgencyOS/**"
      - "GaiaOS/SystemsOS/Core/WorkspaceOS/**"
      - "GaiaOS/SystemsOS/Core/EvolutionOS/**"
      - "GaiaOS/SystemsOS/Core/MemoryOS/**"
      - "GaiaOS/Tests/GAIAOS-AGENCY-WORKSPACE-EVOLUTION-CANARY.py"
      - "GaiaOS/Tests/GAIAOS-MEMORYOS-CANARY.py"
      - "api/gaiaos_app.py"
      - "api/memcon_runtime.py"
      - "api/memcon_entrypoint.py"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Agency/Workspace/Evolution canary
        run: python GaiaOS/Tests/GAIAOS-AGENCY-WORKSPACE-EVOLUTION-CANARY.py
      - name: Run MemoryOS lifecycle canary
        run: python GaiaOS/Tests/GAIAOS-MEMORYOS-CANARY.py
