openapi: 3.1.0
info:
  title: GaiaOS Host Memory Gateway
  version: 1.0.0
  description: >
    Narrow host boundary for GaiaOS MemoryOS candidate discovery and explicit
    durable promotion. E-LANE propagation is returned as a plan and must be
    settled and verified through the GitHub connector.
servers:
  - url: https://ligeia-api.onrender.com
security:
  - bearerAuth: []
paths:
  /host/memory/candipull:
    post:
      operationId: gaiaHostCandiPull
      summary: Create/list bounded MemoryOS candidates from host-provided observations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandiPullRequest'
      responses:
        '200':
          description: Candidate envelope
          content:
            application/json:
              schema:
                type: object
  /host/memory/memsav:
    post:
      operationId: gaiaHostMemSav
      summary: Explicitly promote exact candidate IDs through MemoryOS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemSavRequest'
      responses:
        '200':
          description: Promotion results and E-LANE propagation plans
          content:
            application/json:
              schema:
                type: object
  /host/memory/elane-plan:
    post:
      operationId: gaiaHostElanePlan
      summary: Return a deterministic non-writing E-LANE propagation plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElanePlanRequest'
      responses:
        '200':
          description: E-LANE propagation plan
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Observation:
      type: object
      required: [statement, owner, why_material]
      properties:
        statement: {type: string}
        owner: {type: string}
        why_material: {type: string}
        record_type: {type: string, default: INTERACTION}
        scope: {type: string, default: ChatOS}
        source: {type: string, default: chatgpt-host}
        other_voices:
          type: array
          items: {type: string}
        tension: {type: string}
    CandiPullRequest:
      type: object
      required: [observations]
      properties:
        session_id: {type: string, nullable: true}
        subject: {type: string}
        observations:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Observation'}
        limit: {type: integer, minimum: 1, maximum: 100, default: 50}
    MemSavRequest:
      type: object
      required: [candidate_ids, approved]
      properties:
        candidate_ids:
          type: array
          minItems: 1
          items: {type: string}
        approved: {type: boolean}
        authority: {type: string, default: NAOMI}
    ElanePlanRequest:
      type: object
      required: [candidate_id, record_id]
      properties:
        candidate_id: {type: string}
        record_id: {type: string}
